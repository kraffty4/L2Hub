# High Five x10: ивенты, кошелёк, магазин, ежедневные и недельные поручения.
# Настройки доступны в Хабе → Настройки сервера → Ивенты.
# Все изменения применяются после перезапуска сервера. Время мира сохраняется.

# Боевые события, задания и обычный фарм включаются независимо.
# Пресет x10 включает готовый набор; остальные режимы можно настроить в Хабе.
# Default: False
EventsEnabled = False

# Новые ежедневные и недельные поручения.
# Default: False
ContractsEnabled = False

# Только случайные монеты с обычных мобов; кошелёк доступен всегда.
# Default: False
CoinDropEnabled = False

# Свободные охотники дополняют группы. В охоте на сильнейшего сама цель всегда бот, даже если помощь ботов выключена.
# Default: True
EventHuntersEnabled = True

# Общий промежуток между началами любых двух событий. При совпадении сроков они идут по очереди; действующий бой и время на запись тоже учитываются.
# Default: 60
EventStartGapMinutes = 60

# За сколько минут открывается регистрация в Alt+B. После перезапуска игрокам снова даётся время записаться.
# Default: 10
EventRegistrationMinutes = 10

# Доля 30-секундных отрезков боя с полезными действиями. Учитываются урон, полезное лечение и бафы рядом с сражающимся союзником. Простого присутствия недостаточно.
# Default: 70
EventActivityPercent = 70

# Кроме Обороны (смерть — выбывание): через сколько секунд погибший участник возвращается в бой. У цели в охоте отдельное правило: её смерть завершает событие.
# Default: 5
EventPlayerRespawnSeconds = 5

# Запускает этот формат по расписанию. После выключения он не объявляется, запись и GM-тест недоступны. Остальные события продолжают работать.
# Default: True
FarmEnabled = True

# Отсчитывается от последнего запланированного старта этого формата по времени работы мира. Это желаемый период: общий промежуток и очередь могут отложить старт.
# Default: 120
FarmIntervalMinutes = 120

# Отсчёт при первом включении или смене периода/первой задержки. Обычный перезапуск продолжает сохранённый отсчёт. Изменение наград таймер не сбрасывает.
# Default: 60
FarmFirstDelayMinutes = 60

# Максимальное время боя. Между событиями сохраняется время на регистрацию; два боя одновременно не запускаются.
# Default: 7
FarmMinutes = 7

# Награда активному участнику за полный бой. В охоте ранний конец уменьшает базу пропорционально времени. 0 отключает эту часть награды.
# Default: 100
FarmCoins = 100

# Отдельная валюта оформления за полную длительность и полезную активность. Раннее завершение не даёт жетонов. 0 отключает выдачу.
# Default: 1
FarmStyleReward = 1

# От 1 до 36, включая ботов. Пати не разрезается: если вся группа не помещается, её не зарегистрируют. При большом онлайне арены копируются.
# Default: 18
FarmRoomSize = 18

# Одновременно созданных слабых мобов в каждой копии. Их уровень подбирается по участникам.
# Default: 30
FarmMonsterCount = 30

# Пауза после убийства моба перед появлением замены в этой арене.
# Default: 5
FarmRespawnSeconds = 5

# Крупный личный и командный счёт вверху экрана. Не чаще раза в 10 секунд.
# Default: 15
FarmScoreSeconds = 15

# Общий фонд пати за место; делится между активными живыми игроками, боты долю не забирают.
# Default: 100
FarmRankFirstBonus = 100

# Между первым и последним местом бонус убывает линейно; при равном счёте место общее.
# Default: 20
FarmRankLastBonus = 20

# Быстрый беглец с отдельной наградой, без обычного дропа.
# Default: True
FarmGoldenEnabled = True

# Случайный интервал от появления до следующего; одновременно только один беглец.
# Default: 30
FarmGoldenMinSeconds = 30

# Если меньше нижнего значения, используется нижнее.
# Default: 60
FarmGoldenMaxSeconds = 60

# Не успели убить — исчезает без награды.
# Default: 30
FarmGoldenLifetimeSeconds = 30

# Фонд убившей пати. Начисляется сразу через ledger, строго один раз на цель.
# Default: 30
FarmGoldenCoins = 30

# Убегает от ближайшего участника по проходимой геодате своей копии.
# Default: 1.8
FarmGoldenSpeedMultiplier = 1.8

# С обычных мобов падают штатные хербы: сила — урон x2, скорость, воин — массовый удар. Поднять может любой участник копии.
# Default: True
FarmHerbsEnabled = True

# Один случайный усилитель с обычного моба. С босса и золотого не падает.
# Default: 8
FarmHerbChance = 8

# Усилители работают только в своей арене; исчезают при смерти, выходе и возврате. Повторный подбор обновляет время.
# Default: 25
FarmHerbSeconds = 25

# Вокруг атакующего, только враги своей копии в прямой видимости.
# Default: 250
FarmSplashRadius = 250

# Доля исходного удара, максимум 10 соседних целей; без цепных срабатываний.
# Default: 50
FarmSplashPercent = 50

# Защита от лавины AoE при быстрых атаках и массовых скиллах.
# Default: 2
FarmSplashCooldownSeconds = 2

# На последней минуте появляется один босс. Убили — бонус всем участникам копии.
# Default: True
FarmBossEnabled = True

# В коротком событии появляется не раньше середины боя.
# Default: 60
FarmBossLastSeconds = 60

# HP уровневого шаблона × это значение × число участников при появлении.
# Default: 8.0
FarmBossHpMultiplier = 8.0

# При возврате всем игрокам копии, включая саппорт. Если босс выжил — бонуса нет.
# Default: 50
FarmBossCoins = 50

# Выключено — арены своего диапазона чередуются с сохранением счётчика. В случайном режиме предыдущая не повторяется. Центры — L2HubX10FarmArenas.xml.
# Default: False
FarmArenaRandom = False

# Запускает этот формат по расписанию.
# Default: True
DefenceEnabled = True

# Отсчитывается от последнего запланированного старта этого формата по времени работы мира. Это желаемый период: общий промежуток и очередь могут отложить старт.
# Default: 240
DefenceIntervalMinutes = 240

# Отсчёт при первом включении или смене периода/первой задержки. Обычный перезапуск продолжает сохранённый отсчёт. Изменение наград таймер не сбрасывает.
# Default: 120
DefenceFirstDelayMinutes = 120

# Максимальное время боя. Между событиями сохраняется время на регистрацию; два боя одновременно не запускаются.
# Default: 7
DefenceMinutes = 7

# Устаревшая база Обороны; больше не используется. Вместо неё DefenceWaveCoins и DefenceWaveCoinGrowth.
# Default: 100
DefenceCoins = 100

# Жетоны живым участникам за все волны или лимит времени, если пройдена хотя бы одна волна. Вайп жетонов не даёт.
# Default: 1
DefenceStyleReward = 1

# Следующая волна только после полной зачистки; каждая пятая с мини-боссом.
# Default: 10
DefenceWaveCount = 10

# Размер первой волны. В каждой копии одна группа до 9 участников.
# Default: 3
DefenceFirstWaveSize = 3

# Прибавка мобов за волну до ограничения размера.
# Default: 2
DefenceWaveGrowth = 2

# Мобов в одной волне, максимум.
# Default: 30
DefenceWaveCap = 30

# Дополнительный верхний предел мобов в копии.
# Default: 80
DefenceMaxMonsters = 80

# Средний уровень вошедшей пати минус это число, минимум 1.
# Default: 10
DefenceLevelOffset = 10

# Каждая следующая волна выше на это число; предел 85.
# Default: 3
DefenceLevelStep = 3

# Линейная прибавка к HP шаблона. Работает и после достижения 85 уровня.
# Default: 20
DefenceHpGrowthPercent = 20

# Пауза после зачистки. Перед появлением врагов по центру объявляется модификатор.
# Default: 8
DefenceWavePauseSeconds = 8

# Каждому живому участнику за полностью зачищенную волну. Выдача при общем возврате.
# Default: 5
DefenceWaveCoins = 5

# Волна N: первая награда + (N−1) × прибавка. Двойной модификатор удваивает эту волну.
# Default: 5
DefenceWaveCoinGrowth = 5

# Элита, лучники/маги, быстрые или двойные коины; не более одного на волну.
# Default: True
DefenceModifiersEnabled = True

# 0 — обычные волны, 100 — модификатор каждой волны.
# Default: 40
DefenceModifierChance = 40

# Множитель HP всех врагов элитной волны.
# Default: 2.0
DefenceEliteHpMultiplier = 2.0

# Физическая и магическая атака. Мини-босс появляется в каждой пятой волне.
# Default: 1.5
DefenceEliteAttackMultiplier = 1.5

# Дополнительный множитель одного предводителя каждой пятой волны.
# Default: 5.0
DefenceBossHpMultiplier = 5.0

# Множитель скорости передвижения врагов.
# Default: 1.5
DefenceFastSpeedMultiplier = 1.5

# Разрешить отдельную копию у ворот Гирана.
# Default: True
DefenceGiranEnabled = True

# Разрешить отдельную копию у ворот Адена.
# Default: True
DefenceAdenEnabled = True

# Разрешить отдельную копию у ворот Диона. Города чередуются; если все выключены — Гиран.
# Default: True
DefenceDionEnabled = True

# Запускает этот формат по расписанию. После выключения он не объявляется, запись и GM-тест недоступны. Остальные события продолжают работать.
# Default: True
HuntEnabled = True

# Отсчитывается от последнего запланированного старта этого формата по времени работы мира. Это желаемый период: общий промежуток и очередь могут отложить старт.
# Default: 240
HuntIntervalMinutes = 240

# Отсчёт при первом включении или смене периода/первой задержки. Обычный перезапуск продолжает сохранённый отсчёт. Изменение наград таймер не сбрасывает.
# Default: 240
HuntFirstDelayMinutes = 240

# Максимальное время боя. Между событиями сохраняется время на регистрацию; два боя одновременно не запускаются.
# Default: 7
HuntMinutes = 7

# Награда активному участнику за полный бой. В охоте ранний конец уменьшает базу пропорционально времени. 0 отключает эту часть награды.
# Default: 100
HuntCoins = 100

# Отдельная валюта оформления за полную длительность и полезную активность. Раннее завершение не даёт жетонов. 0 отключает выдачу.
# Default: 1
HuntStyleReward = 1

# Бот отходит от ближайшего преследователя, когда его HP ниже заданного порога. Решение проверяется раз в 5 секунд.
# Default: True
HuntRetreatEnabled = True

# Временное усиление только на этот бой. После окончания возвращаются обычные характеристики охотника.
# Default: 5.0
HuntHpMultiplier = 5.0

# Каждому активному участнику боевой группы, убившей цель. Один последний удар без активности не даёт награды.
# Default: 25
HuntGroupBonus = 25

# За убийство уникального активного преследователя. Повторные убийства того же персонажа не учитываются.
# Default: 5
HuntUniqueKillBonus = 5

# Суммарный предел дополнительных монет цели за убийства; базовая награда считается отдельно.
# Default: 25
HuntTargetBonusCap = 25

# Порог для включённого отступления. Если переключатель выше выключен, это значение не используется.
# Default: 35
HuntRetreatHpPercent = 35

# Каталог в Alt+B → Телепорт: 27 рекомендованных и 4 усиленных адена-спота. Дополнительные пачки и мобы с аденой x2 включаются вместе с каталогом.
# Default: False
FarmSpotsEnabled = False

# За одно выполненное поручение. За день можно взять до пяти; полезный вклад пати учитывается.
# Default: 20
DailyCoins = 20

# За одно из 15 недельных поручений. Предусмотрены бой, крафт и сбор ресурсов; обновление в понедельник.
# Default: 60
WeeklyCoins = 60

# Например, 2 означает 2%, независимо от рейтов сервера. Одна монета за срабатывание; ивентовые, призванные и слишком слабые мобы не подходят.
# Default: 200
CoinDropChance = 200

# Совместимость со старыми конфигами: запасные значения, если отдельные поля формата отсутствуют.
# Default: 100
EventCoins = 100
# Default: 7
EventMinutes = 7

# Ориентир генератора цен, не обменный курс. Цены каталога меняются отдельно.
# Default: 200000
ReferenceAdenaPerCoin = 200000

# Уровни открытия поручений; уведомление приходит при достижении порога.
# Default: 40
DailyMinLevel = 40
# Default: 50
WeeklyMinLevel = 50

# Гарантия адены с обычного монстра, если у него есть денежный дроп. Количество по текущему рейту.
# Default: False
AdenaAlwaysDrop = False
