# High Five x10: ивенты, кошелёк, магазин, ежедневные и недельные поручения.
# Настройки доступны в Хабе → Настройки сервера → Ивенты.
# Все изменения применяются после перезапуска сервера. Время мира сохраняется.

# Боевые события, задания и обычный фарм включаются независимо.
# Пресет x10 включает готовый набор; остальные режимы можно настроить в Хабе.
# Default: False
EventsEnabled = False

# Новые ежедневные и недельные поручения.
# Default: False
ContractsEnabled = False

# Только случайные монеты с обычных мобов; кошелёк доступен всегда.
# Default: False
CoinDropEnabled = False

# Свободные охотники дополняют группы. В охоте на сильнейшего сама цель всегда бот, даже если помощь ботов выключена.
# Default: True
EventHuntersEnabled = True

# Общий промежуток между началами любых двух событий. При совпадении сроков они идут по очереди; действующий бой и время на запись тоже учитываются.
# Default: 60
EventStartGapMinutes = 60

# За сколько минут открывается регистрация в Alt+B. После перезапуска игрокам снова даётся время записаться.
# Default: 10
EventRegistrationMinutes = 10

# Доля 30-секундных отрезков боя с полезными действиями. Учитываются урон, полезное лечение и бафы рядом с сражающимся союзником. Простого присутствия недостаточно.
# Default: 70
EventActivityPercent = 70

# Через сколько секунд погибший участник возвращается в бой. У цели в охоте отдельное правило: её смерть завершает событие.
# Default: 5
EventPlayerRespawnSeconds = 5

# Запускает этот формат по расписанию. После выключения он не объявляется, запись и GM-тест недоступны. Остальные события продолжают работать.
# Default: True
FarmEnabled = True

# Отсчитывается от последнего запланированного старта этого формата по времени работы мира. Это желаемый период: общий промежуток и очередь могут отложить старт.
# Default: 120
FarmIntervalMinutes = 120

# Отсчёт при первом включении или смене периода/первой задержки. Обычный перезапуск продолжает сохранённый отсчёт. Изменение наград таймер не сбрасывает.
# Default: 60
FarmFirstDelayMinutes = 60

# Максимальное время боя. Между событиями сохраняется время на регистрацию; два боя одновременно не запускаются.
# Default: 7
FarmMinutes = 7

# Награда активному участнику за полный бой. В обороне дополнительно учитывается прочность Штаба; в охоте ранний конец уменьшает базу пропорционально времени. 0 отключает эту часть награды.
# Default: 100
FarmCoins = 100

# Отдельная валюта оформления за полную длительность и полезную активность. Раннее завершение не даёт жетонов. 0 отключает выдачу.
# Default: 1
FarmStyleReward = 1

# От 1 до 10, включая ботов. Пати не разрезается: если вся группа не помещается, её не зарегистрируют. При большом онлайне арены копируются.
# Default: 10
FarmRoomSize = 10

# Одновременно созданных слабых мобов в каждой копии. Их уровень подбирается по участникам.
# Default: 30
FarmMonsterCount = 30

# Пауза после убийства моба перед появлением замены в этой арене.
# Default: 5
FarmRespawnSeconds = 5

# Запускает этот формат по расписанию. После выключения он не объявляется, запись и GM-тест недоступны. Остальные события продолжают работать.
# Default: True
DefenceEnabled = True

# Отсчитывается от последнего запланированного старта этого формата по времени работы мира. Это желаемый период: общий промежуток и очередь могут отложить старт.
# Default: 240
DefenceIntervalMinutes = 240

# Отсчёт при первом включении или смене периода/первой задержки. Обычный перезапуск продолжает сохранённый отсчёт. Изменение наград таймер не сбрасывает.
# Default: 120
DefenceFirstDelayMinutes = 120

# Максимальное время боя. Между событиями сохраняется время на регистрацию; два боя одновременно не запускаются.
# Default: 7
DefenceMinutes = 7

# Награда активному участнику за полный бой. В обороне дополнительно учитывается прочность Штаба; в охоте ранний конец уменьшает базу пропорционально времени. 0 отключает эту часть награды.
# Default: 100
DefenceCoins = 100

# Отдельная валюта оформления за полную длительность и полезную активность. Раннее завершение не даёт жетонов. 0 отключает выдачу.
# Default: 1
DefenceStyleReward = 1

# Волны равномерно распределены по длительности события. Побеждённые мобы не возрождаются.
# Default: 10
DefenceWaveCount = 10

# Нижняя база первой волны. При большом составе используется большее из этого числа и трети участников.
# Default: 3
DefenceFirstWaveSize = 3

# Каждая следующая волна больше на это число до ограничения размера волны.
# Default: 2
DefenceWaveGrowth = 2

# Ограничивает размер отдельной волны. Общий предел живых мобов действует дополнительно.
# Default: 30
DefenceWaveCap = 30

# Если на площадке достигнут предел, очередная волна добавляет только недостающее количество.
# Default: 80
DefenceMaxMonsters = 80

# Доля прочности за один удар раз в 3 секунды от добравшегося моба. При составе больше 10 участников урон делится на размер состава / 10. Выше значение — сложнее защита.
# Default: 0.25
DefenceHitPercent = 0.25

# Например, при 20% активный участник получает минимум 20% базы по прочности. При раннем разрушении результат ещё умножается на долю прошедшего времени.
# Default: 20
DefenceMinimumRewardPercent = 20

# Запускает этот формат по расписанию. После выключения он не объявляется, запись и GM-тест недоступны. Остальные события продолжают работать.
# Default: True
HuntEnabled = True

# Отсчитывается от последнего запланированного старта этого формата по времени работы мира. Это желаемый период: общий промежуток и очередь могут отложить старт.
# Default: 240
HuntIntervalMinutes = 240

# Отсчёт при первом включении или смене периода/первой задержки. Обычный перезапуск продолжает сохранённый отсчёт. Изменение наград таймер не сбрасывает.
# Default: 240
HuntFirstDelayMinutes = 240

# Максимальное время боя. Между событиями сохраняется время на регистрацию; два боя одновременно не запускаются.
# Default: 7
HuntMinutes = 7

# Награда активному участнику за полный бой. В обороне дополнительно учитывается прочность Штаба; в охоте ранний конец уменьшает базу пропорционально времени. 0 отключает эту часть награды.
# Default: 100
HuntCoins = 100

# Отдельная валюта оформления за полную длительность и полезную активность. Раннее завершение не даёт жетонов. 0 отключает выдачу.
# Default: 1
HuntStyleReward = 1

# Бот отходит от ближайшего преследователя, когда его HP ниже заданного порога. Решение проверяется раз в 5 секунд.
# Default: True
HuntRetreatEnabled = True

# Временное усиление только на этот бой. После окончания возвращаются обычные характеристики охотника.
# Default: 5.0
HuntHpMultiplier = 5.0

# Каждому активному участнику боевой группы, убившей цель. Один последний удар без активности не даёт награды.
# Default: 25
HuntGroupBonus = 25

# За убийство уникального активного преследователя. Повторные убийства того же персонажа не учитываются.
# Default: 5
HuntUniqueKillBonus = 5

# Суммарный предел дополнительных монет цели за убийства; базовая награда считается отдельно.
# Default: 25
HuntTargetBonusCap = 25

# Порог для включённого отступления. Если переключатель выше выключен, это значение не используется.
# Default: 35
HuntRetreatHpPercent = 35

# Каталог в Alt+B → Телепорт: 27 рекомендованных и 4 усиленных адена-спота. Дополнительные пачки и мобы с аденой x2 включаются вместе с каталогом.
# Default: False
FarmSpotsEnabled = False

# За одно выполненное поручение. За день можно взять до пяти; полезный вклад пати учитывается.
# Default: 20
DailyCoins = 20

# За одно из 15 недельных поручений. Предусмотрены бой, крафт и сбор ресурсов; обновление в понедельник.
# Default: 60
WeeklyCoins = 60

# Например, 2 означает 2%, независимо от рейтов сервера. Одна монета за срабатывание; ивентовые, призванные и слишком слабые мобы не подходят.
# Default: 200
CoinDropChance = 200

# Совместимость со старыми конфигами: запасные значения, если отдельные поля формата отсутствуют.
# Default: 100
EventCoins = 100
# Default: 7
EventMinutes = 7

# Ориентир генератора цен, не обменный курс. Цены каталога меняются отдельно.
# Default: 200000
ReferenceAdenaPerCoin = 200000

# Уровни открытия поручений; уведомление приходит при достижении порога.
# Default: 40
DailyMinLevel = 40
# Default: 50
WeeklyMinLevel = 50

# Гарантия адены с обычного монстра, если у него есть денежный дроп. Количество по текущему рейту.
# Default: False
AdenaAlwaysDrop = False
