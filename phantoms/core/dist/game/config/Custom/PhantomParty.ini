# ---------------------------------------------------------------------------
# Фантомы в пати (L2Hub)
# ---------------------------------------------------------------------------
# Напарник: .buddy -> «Позвать», затем пригласить в пати (/invite имя). В пати он идёт следом,
# бьёт цель владельца, защищает себя и пати, отставшего телепортирует к владельцу.

# Фантом в пати берёт долю опыта и SP. False — весь опыт живым игрокам, как будто фантома нет.
PhantomPartyExpShare = False

# Фантому может выпасть предмет при случайном и поочерёдном распределении и достаётся доля адены.
PhantomPartyLootShare = False

# Отстал от владельца дальше этого (игровые единицы) — телепорт к нему.
PhantomCatchUpRange = 2000

# Бьёт цель владельца, если она не дальше этого от владельца и владелец в бою.
PhantomAssistRange = 1500

# Защищает себя, владельца и пати от мобов в этом радиусе от себя.
PhantomDefendRange = 900

# Сколько секунд ждать вышедшего из игры владельца, потом напарник уходит из мира.
PhantomOwnerLogoutGrace = 60

# Болтовня: шёпот и чат пати напарнику уходят в мозги фейков (FakePlayerBrain, FakePlayerBrainUrl в FakePlayers.ini).
# Приказы («за мной», «стой», «бафни», «хил», «рес», «сядь», «встань», «пока») выполняются и без мозгов.
# False — напарники отвечают только заготовками.
PhantomBrain = True

# Реплика на событие (вступил в пати, твой новый уровень, смерть, рес, сел на MP) — не чаще раза в столько секунд
# на одно событие (у одного напарника или у всей пати владельца).
PhantomEventCooldown = 60

# И не больше стольких реплик на события в минуту на всех напарников; сверх — заготовки или молчание.
PhantomEventsPerMinute = 6

# Общий (белый) чат рядом: напарники из твоей пати, кто стоит рядом, слышат его как чат пати — отвечают вслух и слушаются приказов;
# охотник рядом отвечает, если назвать его по имени. Говоришь в белый чат с фейком по имени или кричишь «лфм» — фантомы молчат.
# False — с фантомами только шёпот и чат пати.
PhantomGeneralChat = True

# Без имени охотник рядом сам встревает в разговор с таким шансом, %. Только если рядом нет других живых игроков:
# при друзьях охотники в чужой разговор не лезут. 0 — только по имени.
PhantomOverhearChance = 25

# Встревает не чаще раза в столько секунд — один охотник и на одного игрока. Реплики считаются в PhantomEventsPerMinute.
PhantomOverhearCooldown = 90
PhantomOverhearPlayerCooldown = 30
