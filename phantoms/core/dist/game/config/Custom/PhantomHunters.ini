# ---------------------------------------------------------------------------
# Охотники-фантомы (L2Hub)
# ---------------------------------------------------------------------------
# Фермеры (Кузя, Вован, ЛунаТик и др.) — настоящие игроки без клиента: начинают с 1 уровня в стартовой деревне
# своей расы, сами качаются на спотах своего уровня (data/L2HubHuntSpots.xml), умирают, возвращаются, меняют профессию.
# Сервер перечитывает этот файл на ходу, когда он меняется: режим и сброс ставит лаунчер L2Hub (вкладка «Фантомы»).

# Когда живут охотники:
#   OFF — их нет в мире;
#   ALWAYS — всегда, пока запущен сервер (качаются и без тебя);
#   WITH_PLAYERS — только пока в игре есть живой игрок (уходят через HuntersIdleTimeout после последнего).
# С охотниками по миру ходит и Танатос — единственный ПК сервера, 76-го уровня (docs/PHANTOMS.md, раздел 4.45): своего
# выключателя у него нет, охотников нет — нет и его.
HuntersMode = ALWAYS

# Настоящие сутки (docs/PHANTOMS.md, раздел 4.62): вечером мир полон, к утру народу мало. Охотники входят и выходят по реальным часам, у каждого своя
# привычка и свой час; живого в пати, рейд, ивент, бой и разговор охотник не бросает. Фейки городов и их болтовня — тоже по реальным часам.
# Выключено — всё как прежде: охотники по HuntersMode, у фейков игровое время.
# DailyRhythmStrength — сколько охотников (0–100 %) в данный день живёт по расписанию, остальные весь день в сети; 0 — все в сети, 100 — утром и ночью почти никого.
# DailyRhythmShift — сдвиг часов от -12 до 12: играешь ночью, поставь 6, и твои 2 часа ночи станут вечерними 8.
DailyRhythm = False
DailyRhythmStrength = 70
DailyRhythmShift = 0

# Сброс прогресса: имена через запятую или ALL. Охотник удаляется из базы и появляется заново с 1 уровня.
# Выполняется один раз — когда меняется HuntersResetId (лаунчер увеличивает его на 1).
HuntersReset =
HuntersResetId = 0

# Самопроверка без клиента (для разработки): LFM — охотник «кричит» «лфм нужен дд», откликнувшийся приходит,
# принимает инвайт, минуту ходит в пати и возвращается на кач; шаги — в логе с пометкой SelfTest.
# STRATEGY — 10 минут мозги-стратег думает и без живых игроков: все охотники на спотах спрашивают модель
# в ближайшие 3 минуты (в пределах HunterStrategyPerMinute); первый ответ — нарочно мусор (проверка отката
# на правила), следующие шесть — случайный вариант без модели (проверка выполнения), остальные — модель.
# UI — окна «где охотники» (//hunters для GM и «Охотники» на Alt+B) от лица первого охотника в мире
# пишутся в log/L2HubHuntersUi.html: открыть в браузере и посмотреть, что строится.
# EPIC — ближайший рейд на эпика (проверка — сразу) собирается без живого игрока, а живого в нём играет один охотник рейда:
# бой с эпиком без клиента (docs/PHANTOMS.md, 4.43). THANATOS — Танатос выходит в мир сразу, без ожидания после старта и после смерти (4.45).
# THANATOS_BODIES — все его тела по очереди выходят рядом с охотником и уходят: сабкласс, класс, уровень, раса, оружие, удары
# (4.45, «Новое тело»; итог — «done, N of M ok»), дальше — как THANATOS, в теле мага. Тело ложится в базу — только на копии базы.
# THANATOS_DEATH — как THANATOS, но трижды через 30 с после выхода его убивает ближайший охотник; смерть штатная (летопись, карма роняет
# вещи, следующее тело, сутки), сутки самопроверка обнуляет — он выходит сразу в новом теле (4.45; итог — «done, N of M ok»). Только на копии базы.
# SUMMON — 14 минут: у каждого призывателя на споте слуга через 90 с гибнет (его бафы — в лог), призыватель должен призвать снова за 3 минуты
# (4.55; итог — «done, N of M summoners summoned again»). Только на копии базы.
# MIND — протокол v1 стратега без мозгов (4.3): охотник на споте получает ответы по сценарию — цель и спот, которого нет; спот не по уровню;
# подходящий спот; HUNT. Запросы (с goal и last) и итоги — в логе с пометкой SelfTest MIND.
# CLAN — кланы охотников без клиента (4.41): охотник создаёт клан L2HubTest и играет в нём живого игрока, второй охотник
# незнакомым отказывает, другом вступает; репутация за рейд с игроком и без него; стал врагом — уходит; клан распускается.
# Клан и штрафы ложатся в базу — только на копии базы. Итоги — в логе с пометкой SelfTest CLAN.
# CLANLIFE — живые кланы охотников (4.50), ждёт дюжину свободных охотников от 10-го уровня: черты, основание с именем от мозгов,
# двое друзей вступают, 1-й уровень за адену, 5-й уровень и скиллы за репутацию, обида расходится по клану, .clans, просьба
# игрока, верность (уход к «живому» другу), роспуск. Кланы, адена и отношения ложатся в базу — только на копии базы.
# CLANWAR — войны кланов охотников (4.50, этап 3), ждёт дюжину свободных охотников от 10-го уровня: два клана по двое, обида без
# убийств войны не начинает, убийства — начинают; война в Mobius (бить без флага и кармы), драка двух охотников, счёт, перемирие
# и запрет новой войны на сутки. Кланы и войны ложатся в базу — только на копии базы.
# RAIDRIVAL — очередь за РБ (4.65): первый круг — второй рейд ждёт очереди, второй круг — с HunterRaidTakeBusy бьёт вместе с первым. Сбор сокращён, ключи возвращаются.
# SPOTDISPUTE — споры за спот (4.64): живого играет охотник на споте горячего: просьба, отжатый моб, обида, знакомый, повтор сразу — отказ. Ключ возвращается.
# REGULARS — завсегдатаи (4.63), ждёт всех охотников: мир без них, два выбора спота с ключом, через три минуты кто рядом с кем, живого играет охотник. Ключ возвращается.
# MOMENTS — случайности людей (4.77), ждёт дюжину охотников в мире: живого играет охотник, ответы окна обмена — за него. Подарок принят, отклонён, в окно положили вещь; разборка из-за дропа; кидок. Ключи возвращаются.
# WORLDAGE — возраст мира (4.90), ждёт всех охотников: гистограмма уровней, через 5 минут верхушка и середина против своей доли — шмот, сосы, банки, спот; куча. Ключ ставит сам прогон.
# TWINKS — гномы-твинки (4.91), ждёт дюжину охотников в мире: передача, лавка, лимит, молчание, настоящие покупки, выручка хозяину, вход после рестарта. Ключи возвращаются.
# PETITION — петиция, когда GM нет (4.76): ключ выключен — молчит, включён — отвечает и пишет в журнал, повтор сразу — без ответа; подсказки по словам. Ключ возвращается.
# DAYCYCLE — настоящие сутки (4.62): кривая онлайна по часам среды и субботы, затем часы переставляются на вечер, ночь и день, мир живёт на каждом 150 с.
# CLANCREST — эмблемы кланов охотников (4.61): два клана, выдача с уровня, разные эмблемы, вторая выдача их не трогает; кланы распускаются.
# BOARDSHOP — наборы бафов и условия продажи лута на доске Alt+B (4.60): охотник играет игрока, страницы в log/L2HubBufferSets.html.
# SIEGE — осада замка кланом охотников (4.74): дюжина охотников, клан, запись, бой, печать, смена владельца; ворота ослаблены; клан распускается.
# CLANBOARD — кланы на доске Alt+B (4.59), ждёт дюжину свободных охотников от 10-го уровня: живого главу играет охотник; набор,
# заявки, отказ, объявление войны с подтверждением; страницы в log/L2HubClanBoard.html; кланы распускаются.
# CLANWARPLAYER — война клана охотников с кланом игрока (4.50, этап 4), ждёт дюжину свободных охотников от 10-го уровня: живого
# играет охотник со своим кланом L2HubTest, против — клан охотников (до четырёх); обида без убийств войны не начинает, убийства —
# начинают; нападают не больше HunterClanWarPlayerAttackers разом; перемирие и сутки мира клану игрока; вторую войну клан игрока
# прекращает сам. Кланы и войны ложатся в базу — только на копии базы.
# NEAR — шаг 6 «Разума» (4.3, «Протокол v2»): «живого» играет охотник, его приводят к проверяемому (лучше хилер с ресом); по сценарию —
# SHARE, HELP (хил, рес, бафы), TRADE лавкой и [[PRICE]], YIELD, потом 5 минут настоящие мозги. Смерть, лавка и адена — только на копии базы.
# SEASONAL — сезонные события (4.34): сильный охотник с 12 кк адены четыре раза подряд у NPC каждого идущего события, где умеет больше,
# чем постоять: мастер Йоги — посох, свитки, заточка, награда; Санта — ёлки, шапки, оружие по билету, благословение (украшения и билет
# дают). Адена и вещи ложатся в базу — только на копии базы. Итоги — с пометкой SelfTest NEAR / SEASONAL.
# EXCHANGE — мировая биржа (4.51, только Essence): охотник, у которого есть вещь лучше надетой не дешевле L-Coin, — покупатель;
# другой охотник выставляет такую вещь по своей оценке, покупатель с L-Coin на лот идёт на биржу — покупает и надевает, продавец
# забирает выручку. Вещи, адена и L-Coin ложатся в базу — только на копии базы. Итоги — с пометкой SelfTest EXCHANGE.
# Выполняется один раз — когда меняется HuntersSelfTestId.
HuntersSelfTest =
HuntersSelfTestId = 0

# Режим WITH_PLAYERS: через столько секунд после выхода последнего живого игрока охотники уходят из мира.
HuntersIdleTimeout = 300

# Сколько секунд лежит убитый охотник, прежде чем вернуться в город.
HunterRespawnDelay = 20

# Если рядом с трупом (в 1500) живой игрок, не враг, — охотник лежит до стольких секунд: вдруг реснёт. 0 — не ждать.
# Когда на охотника кастуют рес, он в любом случае ждёт конца каста (свиток реса — 15 с). В пати охотник ждёт 2 минуты.
HunterReviveWait = 60

# ---------------------------------------------------------------------------
# Экономика x1 (docs/PHANTOMS.md, раздел 4.2): всё за свою адену, как у живого игрока.
# ---------------------------------------------------------------------------
# Запас сосов своего грейда, который охотник покупает в городе по цене магазина.
HunterShotCount = 2000

# Сосы с умом: на сосы — не больше стольких процентов свободной адены (свободная — всё, кроме отложенного на профу).
# Мало денег — бьёт без сосов, как новичок, и не спускает заработок на них.
HunterShotBudget = 30

# Запас стрел или болтов у лучников (покупаются первыми: без них лук не стреляет).
HunterAmmoCount = 3000

# Запас хилок своего уровня (на банки — не больше четверти адены); AutoUse пьёт их на 40 % HP.
HunterPotionCount = 30

# Плата за телепорт в город и обратно с 40 уровня (до 40 — бесплатно, как у новичков).
HunterTeleportFee = 15000

# Раз в столько минут охотник заходит в город, даже если сосов и места хватает.
HunterTownInterval = 120

# Порог лавки по уровню охотника «уровень:адена;…»: вещи дороже порога (цена магазина; у пачек — за всю пачку:
# ресурсы, рецепты, заточки) он не сдаёт NPC, а выставляет в своей лавке в Гиране. Низкоуровневым ценно и дешёвое.
HunterStoreMinPrices = 1:2000;20:5000;40:20000;52:50000;61:100000;76:300000

# Шанс дропа вещей (не адены) с мобов, убитых охотником, — чтобы было что ставить в лавку. Адену задаёт Rates.ini для всех.
HunterDropChanceMultiplier = 2.0

# Профессия стоит адену «уровень:цена;…»: дорос, но не накопил — качается без профы и копит, шмот не покупает.
# Цена 0 — профа даром, сразу на уровне. У Essence так по умолчанию (phantoms/ess_crow/config.json): там профы даром и у игроков.
HunterProfessionPrices = 20:50000;40:1000000;76:10000000

# Квесты-симуляция: на этих уровнях охотник берёт квест, качается ещё HunterQuestMinutes минут (как за
# квестовыми мобами), потом идёт в город сдавать и получает HunterQuestReward × уровень² адены.
# Живые игроки на x1 до 20-го живут на квестах — охотникам это заменяет их.
HunterQuests = True
HunterQuestLevels = 6,10,14,17,20,23,26,30,34,38,42,46,50,55,60,65,70,75,80
HunterQuestMinutes = 15,25
HunterQuestReward = 40

# Не больше стольких лавок охотников одновременно; сколько минут сидит лавка.
HunterMaxStores = 4
HunterStoreMinMinutes = 20
HunterStoreMaxMinutes = 40

# Лавка скупки (docs/PHANTOMS.md, раздел 4.29): охотник, который копит на вещь и накопил на неё больше половины
# цены магазина, садится на площади Гирана с «Куплю <вещь>» — со скидкой по характеру (55–85% цены магазина).
# Продать ему может игрок; охотники, у которых такая вещь лежит в сумке, приходят и продают сами. И наоборот:
# в лавку скупки игрока на площади Гирана охотники несут то, что у них в сумке (дороже, чем дал бы NPC).
HunterBuyStores = True

# Охотники со свободной аденой точат надетое настоящими свитками с настоящим шансом сервера: большинство до +3, жадные дальше и ломают вещи.
# Заметный успех и поломка — крик в торговый чат и строка в летописи. False — никто не точит.
HunterEnchant = True

# Старый шмот с грейдом после покупки нового — не NPC за полцены, а в сумку, на рынок: в лавках появляется
# б/у шмот D и выше для младших охотников и игрока. Не продался дважды — уйдёт NPC, как раньше.
HunterSellOldGear = True

# Мировая биржа (docs/PHANTOMS.md, раздел 4.51; только Essence, у других хроник её нет — ключи ничего не делают): в городе охотник
# забирает L-Coin за проданное и непроданные вещи, покупает за L-Coin вещь лучше надетой (не дороже своей оценки или средней
# цены других лотов той же вещи) и выставляет оружие, броню и бижутерию из товаров лавки — по средней цене биржи, нет её — по своей
# оценке, если на плату за лот (WorldExchange.ini: AdenaFee) хватает свободной адены. Своя оценка — цена магазина / HunterExchangeAdenaPerLCoin:
# пары «адена — L-Coin» в датапаке нет, это допущение (при 50000 плата за лот — 20% цены магазина, NPC дал бы 50%).
# Своих выставленных лотов у охотника — не больше HunterExchangeLots.
HunterExchange = True
HunterExchangeAdenaPerLCoin = 50000
HunterExchangeLots = 3

# Рейды охотников на РБ (docs/PHANTOMS.md, раздел 4.32): раз в HunterRaidInterval минут (первый — через HunterRaidFirst
# после старта) лидер-охотник собирает пати из охотников близкого уровня (всего HunterRaidSize: от и до, с хилером,
# если есть свободный) на живого РБ уровня лидера + HunterRaidBossLevel (от и до: РБ рассчитаны на полную пати живых,
# пятеро охотников на РБ своего уровня ложатся за минуту; выше босса больше чем на 8 — проклятие РБ, таких не берут),
# кричит о сборе в торговый чат и ведёт всех к боссу;
# через HunterRaidGather минут — бой. Живой игрок вступает в пати рейда и телепортируется к сбору командой .raid.
HunterRaids = True
HunterRaidFirst = 30
HunterRaidInterval = 60,120
HunterRaidGather = 4
HunterRaidSize = 3,5
HunterRaidBossLevel = -8,-4
# Удары охотников рейда по боссу — во столько раз сильнее (удары живых игроков — как есть): РБ рассчитаны на полную
# пати живых, и пятеро охотников без этого босса почти не царапают (прогоны 2026-10-21: без множителя 2–7% HP за бой;
# с полным рейдовым пакетом бафов и ×8 — Zombie Lord Ferkel за минуту, поэтому ×4: бой на пару минут, игрок успевает вписаться).
HunterRaidDamage = 4
# Удар босса (и его миньонов) по охотнику рейда — во столько раз слабее (часть урона возвращается сразу): без этого
# босс кладёт пятерых охотников за минуту (прогон 2026-10-21 с HunterRaidDamage = 5 — за 45 секунд, у босса 88% HP).
HunterRaidArmor = 5

# Рейды на эпиков (docs/PHANTOMS.md, раздел 4.43): эпик жив и к нему не нужен вход — Королева муравьёв, Ядро, Орфен, старый Закен
# (Баюм, Антарас, Валакас — через NPC и предмет, Фринтеза и Белет — инстансы под командный канал: их нет) — охотники под его уровень
# (как у РБ, HunterRaidBossLevel) собирают рейд, как на РБ, но пати больше: HunterEpicSize — сколько, мин. и макс. (не больше 9).
# Только с живым игроком: рейд собирается, когда в мире есть живой под эпика; охотники зовут криком и сообщением (.raid) и ждут
# HunterEpicWait минут, живой пришёл к сбору — бой через минуту, не пришёл никто — расходятся: без живого эпика не бьют.
# Эпика ослабляют «Эпики малого мира» для всех (GrandBoss.ini: SmallWorldEpics — HP и свита), охотников бережёт только HunterEpicArmor
# (удар эпика и его логова по охотнику рейда — во столько раз слабее: боты не уворачиваются). Провал — когда легли все, лёг лидер —
# ведёт следующий. После провала эпик HunterEpicExhaust минут не восстанавливает HP («измор»), следующий заход — через 10 минут.
# Сбор, провал и убийство — в «Летописи мира». Нужен HunterRaids = True.
HunterEpicRaids = True
HunterEpicSize = 5,9
HunterEpicArmor = 5
HunterEpicWait = 10
HunterEpicExhaust = 30

# PvP-ивенты Mobius — TvT, Deathmatch, CtF (docs/PHANTOMS.md, раздел 4.33): пока у менеджера ивента открыта регистрация,
# охотники на каче записываются сами (раз в 10 с — шанс HunterPvpEventChance % × вспыльчивость характера), не больше
# HunterPvpEventMax; на арене дерутся за свою команду (в Deathmatch — каждый за себя), враги по отношениям — первыми,
# хилер лечит своих. Запускает ивенты расписание (L2HubEvents.ini: PvpEvents, PvpMinLevel) или GM; без охотников
# одному игроку участников (от 4) не набрать. В CtF у команды охотников один бегун: берёт флаг у штаба противника
# и несёт к своему; остальные бьют того, кто несёт их флаг, первым.
HunterPvpEvents = True
HunterPvpEventMax = 12
HunterPvpEventChance = 30

# Сезонные события Mobius (календарь L2HubEvents.ini; docs/PHANTOMS.md, раздел 4.34): охотник в городе подходит к NPC
# идущего события рядом (не чаще раза в 30 минут) — у них собирается народ — и, где умеет, делает то же, что игрок:
# L2 Day — сдаёт слова у менеджера, Heavy Medal — «орёл или решка» на значок у кошки Винни и медали на призы у кота Роя,
# Gift of Vitality — баф, Freya — зелье; у NPC с мультиселлами меняет валюту события (не адену) на самое дорогое, на что
# хватает, до трёх обменов. Буквы, медали и прочий дроп событий охотникам падают и так, как любому игроку.
HunterSeasonalEvents = True

# Суперчемпионы (ChampionMonsters.ini: SuperChampionEnable; docs/PHANTOMS.md, раздел 4.35): в мире жив легендарный
# чемпион под уровень охотников — они собирают на него рейд (как на РБ: лидер с кача, хилер обязателен, сбор 2 минуты,
# .raid — вступить), без общего интервала рейдов и без множителей урона и брони (HunterRaidDamage, HunterRaidArmor —
# только для РБ). Нужен HunterRaids = True.
HunterSuperChampions = True

# Олимпиада (docs/PHANTOMS.md, раздел 4.39): охотник с HunterOlympiadLevel (к 76-му у него третья профа) становится дворянином,
# в часы соревнований (Olympiad.ini: OlympiadStartTime, OlympiadCPeriod) записывается на матч без класса — раз в минуту шанс
# HunterOlympiadChance % × вспыльчивость, всего не больше HunterOlympiadMax; на стадионе дерётся с соперником, матч, очки и героев
# ведёт Mobius. Матчей при малом мире — с двух записавшихся (патч 0025 c4-interlude), иначе нужно 9 (без класса).
HunterOlympiad = True
HunterOlympiadLevel = 76
HunterOlympiadMax = 10
HunterOlympiadChance = 30

# Дуэли (docs/PHANTOMS.md, раздел 4.40): охотник отвечает на /duel игрока по отношениям и характеру — врагу охотно, другу со смешком,
# незнакомому — как повезёт (сдержанный чаще отказывает), сильно старше или младше — отказ; дерётся тактикой своего класса, исход —
# в отношения и «Летопись мира». HunterDuelRivalChance — шанс в минуту, % (0 — выкл.), что охотник вызовет соседа по споту (враги — первыми;
# одна дуэль охотников за раз).
HunterDuels = True
HunterDuelRivalChance = 5

# Друзья и обмен (docs/PHANTOMS.md, раздел 4.70). HunterFriends — охотник отвечает на заявку в друзья: врагу отказ, знакомому да, незнакомому как повезёт;
# друг виден в сети и отвечает на письмо. HunterTrade — охотник отвечает на /trade: открывает окно и платит адену за вещи (0,55–0,85 цены магазина, до 80 % кошелька),
# адена без вещей — подарок. Выключено — штатный отказ.
HunterFriends = True
HunterTrade = True

# Торговый чат как поток (docs/PHANTOMS.md, раздел 4.71). HunterChatFlowPerHour — строк в час в регионе, где есть живой игрок (0 — выкл.); где живых нет, строк нет.
# WTS и WTB — настоящие лавки и нужды охотников по их ценам, LFP — соло-охотник, РБ — живой босс ему по уровню: без мозгов.
# HunterChatFlowBranchChance — шанс (%), что другой охотник ответит на строку; HunterChatFlowAnswerChance — что ответят живому, написавшему в трейд. Оба — только мозгами.
HunterChatFlowPerHour = 60
HunterChatFlowBranchChance = 15
HunterChatFlowAnswerChance = 35

# Вход в мир (docs/PHANTOMS.md, раздел 4.72). HunterWelcome — выключатель. Живой вернулся после перерыва в HunterWelcomeMinAway минут или больше:
# HunterWelcomeLines — сколько строк сводки «пока тебя не было» из Летописи мира (0 — без сводки);
# HunterWelcomeWhispers — сколько знакомых охотников напишут в личку (0 — никто; только мозгами, без заготовок).
HunterWelcome = True
HunterWelcomeMinAway = 60
HunterWelcomeLines = 4
HunterWelcomeWhispers = 2

# Мир идёт при выключенном сервере (docs/PHANTOMS.md, раздел 4.73). Решение автора 2026-10-31: включено. Охотник при входе в мир получает опыт и адену
# за простой сервера от часа: боёв не считаем, только правдоподобный итог; отношения не трогаем. HunterOfflineWorldShare — сколько процентов простоя охотник «играл»
# (у каждого 0,5–1,5 от этого), HunterOfflineWorldMaxDays — больше скольких дней за один простой не считать.
HunterOfflineWorld = True
HunterOfflineWorldShare = 10
HunterOfflineWorldMaxDays = 14

# Осады замков кланами охотников (docs/PHANTOMS.md, раздел 4.74). Решение автора 2026-10-31: включено. Бой тяжёлый, вид боя глазами ещё не смотрели.
# Осада настоящая: расписание, ворота, стражу и смену владельца ведёт Mobius, модуль записывает кланы и водит охотников.
# HunterSiegeAttackers — сколько кланов охотников нападает на замок. Клан идёт, если у него есть уровень для осады (SiegeClanMinLevel в Siege.ini),
# глава не ниже HunterSiegeMinLevel и в сети не меньше HunterSiegeMinMembers бойцов от 20-го уровня. Записывается за HunterSiegeRegisterHours часов до осады.
# HunterSiegeGarrison — сколько процентов стражи (56–60-й уровень, сотни на замок) остаётся в замке без владельца, если нападают охотники. 100 — вся.
HunterSieges = True
HunterSiegeAttackers = 2
HunterSiegeMinMembers = 8
HunterSiegeMinLevel = 60
HunterSiegeRegisterHours = 168
HunterSiegeGarrison = 15

# Семь печатей (docs/PHANTOMS.md, раздел 4.42; у Classic и Essence их нет): в неделю соревнования охотник с HunterSevenSignsLevel вступает у жреца
# в Рассвет или Закат (друг живого игрока — чаще за его сторону, враг — против; иначе по характеру) и голосует так, чтобы у стороны были
# Печати Алчности и Гнозиса (купец и кузнец Маммона). Печатные камни у Mobius падают только в катакомбах и некрополях, а охотники там
# не качаются: охотник со стороной находит их на споте — HunterSevenSignsStoneChance % с убитого моба (не младше HunterSevenSignsLevel − 5)
# — и сдаёт в городе. Итог периода —
# в «Летопись мира».
HunterSevenSigns = True
HunterSevenSignsLevel = 20
HunterSevenSignsStoneChance = 5

# Охотник в клане игрока (docs/PHANTOMS.md, раздел 4.41): приглашение в клан охотнику (как живому — из окна клана) принимает
# сервер. Друг (благодарность от 3 и больше обиды) вступает, враг и незнакомый отказывают со словами. В клане охотник
# качается сам, виден в списке клана в сети и отвечает в клан-чате; стал врагом соклановца — уходит со словами, штраф
# на вступление (как у Mobius) — только ему. Охотники — обычные члены клана: идут в лимит членов и в условия уровня клана.
# HunterClanJoinMax — больше стольких охотников в одном клане не берут; 0 — без предела (решение автора 2026-10-25): предел
# ставят лимит членов клана по его уровню (Mobius) и сами охотники.
HunterClanJoin = True
HunterClanJoinMax = 0
# Свои эмблемы у кланов охотников (docs/PHANTOMS.md, раздел 4.61): с уровня HunterClanCrestLevel клан получает эмблему из data/ClanCrests
# (их пишет tools/clan_crests.py), у каждого своя. Эмблема игрока и уже выданная не меняются.
HunterClanCrests = False
HunterClanCrestLevel = 3
# Набор в клан игрока на доске Alt+B (docs/PHANTOMS.md, раздел 4.59): глава открывает набор с фильтром уровня и роли, свободные
# охотники сами подают заявки, глава или член клана с правом приглашать принимает. Заявка — решение самого охотника, правило
# приглашения «незнакомый отказывает» её не касается. HunterClanRecruitPerMinute — сколько заявок прибавляется в минуту, пока
# глава в игре; HunterClanRecruitMax — сколько заявок лежит разом.
HunterClanRecruit = False
HunterClanRecruitPerMinute = 3
HunterClanRecruitMax = 10

# Репутация клану за рейды охотников: убит РБ — клану каждого живого игрока, кто был в рейде (.raid) и рядом с боссом,
# HunterClanRaidReputation (от и до: РБ 20-го уровня и ниже — от, 80-го и выше — до); эпик — вдвое больше, суперчемпион —
# втрое меньше. Клан, чьи охотники были в рейде без его живых игроков, получает HunterClanReputationAway % от этого —
# если кто-то из живых этого клана в игре. Один клан за одного босса — один раз.
HunterClanReputation = True
HunterClanRaidReputation = 100,300
HunterClanReputationAway = 50

# Живые кланы охотников (docs/PHANTOMS.md, раздел 4.50; решение автора 2026-10-25 — «хочу больше кланов на сервере», «рандом»).
# Ни списка кланов, ни их числа: кланы основывают сами охотники. У каждого охотника на этом сервере три черты из броска
# (зерно — objectId персонажа, в каждом мире своё): одиночка (в кланы не идёт; чем нелюдимее, тем чаще), лидерство
# (шанс основать клан; выше у общительных и вспыльчивых) и верность своему клану. Раз в 10 минут охотник от 10-го уровня
# без клана может основать клан: шанс — HunterClanFoundChance % × лидерство × доля охотников без клана × друзья (двое друзей
# без клана — сполна, один — половина, ни одного — 15 %). Имя придумывают мозги, без них — из слогов. Глава зовёт друзей,
# потом знакомых со спота (±10 уровней), пока клан не дорос до своего «аппетита» — случайного размера из HunterClanSize
# (у общительного главы — больше); набор кричит в торговый чат, игрок может попроситься шёпотом главе («возьми в клан»).
# Уровни 1–5 — когда хватает членов и среднего уровня, за 1-й и 2-й глава платит адену; выше — по правилам хроники:
# H5, Epilogue и Interlude — репутация и члены (Feature.ini, «Кланы малого мира»), Classic и Essence — клановый опыт Mobius.
# Репутацию клану с 5-го уровня дают рейды его охотников (HunterClanReputationAway % от рейда), клановые скиллы клан
# учит сам за репутацию. Один глава дольше трёх суток — клан распускается. Кланы ложатся в базу навсегда; .clans — список,
# .clans reset (GM) — распустить все кланы охотников.
HunterClans = True
HunterClanFoundChance = 10
HunterClanSize = 5,25

# Обида и благодарность к игроку расходятся по клану охотников: обидел одного — остальные в сети помнят столько процентов
# (убил, напал, послал; реснул, спас, подлечил). 0 — каждый помнит только своё.
HunterClanShare = 30

# Кланы как сила (docs/PHANTOMS.md, раздел «Кланы как сила»).
# HunterClanInvitePlayers — глава клана охотников сам зовёт живого без клана: друга клана где угодно, незнакомого только рядом;
# шёпот и штатное окно приглашения. Врага соклановца не зовёт; одного живого — всё реже (1, 2, 4, 8, 16 часов), тот же клан — раз в 12 часов.
# HunterClanTitles — титулы по месту в клане: глава, замы, хил, танк, рекрут. Чужие титулы не трогает; выключатель снимает свои.
# HunterClanAlliances — союзы кланов охотников по правилам Mobius (основатель от 5-го уровня, партнёр от 3-го, до AltMaxNumOfClansInAlly кланов).
# Союзники не воюют; война и ссора глав разрывают союз. Выключатель не трогает уже заключённые, новых и разрывов нет.
# HunterClanTop — окно .clans top и кнопка на доске «Охотники»: все кланы сервера по силе.
# HunterClanDrama — переворот, раскол и громкий развал клана охотников; в летопись и в торговый чат.
# HunterClanDramaHours — не чаще одного такого события на весь мир за столько часов (0 — без ограничения).
HunterClanInvitePlayers = True
HunterClanTitles = True
HunterClanAlliances = True
HunterClanTop = True
HunterClanDrama = True
HunterClanDramaHours = 24

# Войны кланов охотников (docs/PHANTOMS.md, раздел 4.50, этап 3). Раз в 10 минут кланы охотников от HunterClanWarLevel уровня
# сводят счёты: обиды охотников одного клана на членов другого в сети (убил, мешал охотиться, оскорбил) складываются в обе
# стороны, и пара с суммой от HunterClanWarGrudge воюет — объявляет глава обиженного клана, если он в игре. У клана одна война
# за раз. Война — настоящая война Mobius: врага бьют без флага и без кармы, Mobius ведёт и репутацию. Охотники враждующих кланов
# при встрече дерутся (та же пара — не чаще раза в 10 минут), с HunterClanWarWitness — только при живом игроке рядом, иначе
# война идёт и без зрителей. Война кончается через HunterClanWarHours часов или после HunterClanWarKills убийств на двоих
# (0 — этого предела нет; оба 0 — война идёт, пока её не снимут выключателем или не распадётся клан), дальше
# HunterClanWarTruceHours часов перемирия: эта пара не воюет (0 — без перемирия). Выключатель гасит идущие войны перемирием.
# Объявления и итоги — в «Летописи». Условия числа членов у кланов охотников нет.
HunterClanWars = True
HunterClanWarGrudge = 15
HunterClanWarLevel = 3
HunterClanWarHours = 6
HunterClanWarKills = 10
HunterClanWarTruceHours = 24
HunterClanWarWitness = False

# Войны кланов охотников с кланом игрока (docs/PHANTOMS.md, раздел 4.50, этап 4). Раз в 10 минут клан охотников от
# HunterClanWarLevel уровня сводит счёты с кланом живого игрока в сети (тоже от HunterClanWarLevel уровня — у Mobius война
# с 3-го): обиды его охотников на членов клана игрока — на живых и на охотников в нём — от HunterClanWarGrudge, и глава клана
# охотников, если он в игре, объявляет войну. У клана игрока одна такая война за раз, после неё — мир на
# HunterClanWarTruceHours часов. Охотники клана
# при встрече нападают на живых врагов без флага и кармы, на одного — не больше HunterClanWarPlayerAttackers разом; с
# охотниками в клане игрока дерутся, как в войне кланов охотников. Конец — как у войны кланов охотников (HunterClanWarHours,
# HunterClanWarKills) или когда клан игрока сам прекратил войну или сдался в окне клана (по правилам Mobius). Выключатель
# гасит идущие войны с кланами игроков перемирием.
HunterClanWarsPlayer = True
HunterClanWarPlayerAttackers = 3
# Клан охотников отвечает на войну, которую ему объявил сам игрок (у High Five, Epilogue и Interlude она односторонняя, пока
# второй клан не объявит в ответ). Раз в 10 минут глава клана охотников в игре принимает её при тех же условиях, что и свою:
# у обоих кланов нет другой войны, перемирие прошло, в клане игрока кто-то живой в игре. Не вышло — следующий проход.
HunterClanWarReply = False

# Охотники слышат «лфм / нужен хил / танк / дд» в общем, торговом и крик-чате и просятся в пати.
HunterLfm = True

# Больше стольких охотников на один спот не ставится, пока есть свободные споты того же уровня.
HuntersPerSpot = 2

# Завсегдатаи и толпа рядом (docs/PHANTOMS.md, раздел 4.63). Те же ники на тех же местах, а не 100 человек на 1400 спотах порознь. Выключено — как прежде.
# HunterRegularsShare — доля охотников (%), которые любят людные места, остальные держатся двух своих спотов и HuntersPerSpot.
# HunterRegularsPlaces — сколько мест в диапазоне уровней охотника людные: несколько, чтобы все не сбились в одно. Какие — по числу мобов и неделе.
# HunterRegularsCrowd — сколько охотников вмещает людное место вместо HuntersPerSpot.
# HunterRegularsNearLiving — у живого свои завсегдатаи из ровни, одни и те же: столько их может прийти на его спот; 0 — не приходят специально.
HunterRegulars = False
HunterRegularsShare = 70
HunterRegularsPlaces = 2
HunterRegularsCrowd = 5
HunterRegularsNearLiving = 3

# Споры за спот (docs/PHANTOMS.md, раздел 4.64): горячий охотник, который стоит на споте давно, не уступает живому. Сначала просит уйти, потом отжимает его моба
# и копит обиду, потом зовёт знакомого. Живого не бьёт: ответит сам — дальше обычные предъява и махач. На сильного не лезет, друга и напарника не трогает.
# Спорит с вежливой охотой, автор снял её для таких охотников сам (решение 2026-10-31). HunterSpotDisputeShare — доля горячих (%), кроме них спорят рисковые, осторожные никогда.
# HunterSpotDisputeMinutes — та же пара спорит не чаще; с одним живым спорит один охотник и не чаще раза в 10 минут.
HunterSpotDisputes = True
HunterSpotDisputeShare = 25
HunterSpotDisputeMinutes = 30

# Летопись как истории (docs/PHANTOMS.md, раздел 4.66). Ссоры, махач, уход из клана и поломки заточки пишутся в «Летопись», повтор помнит прошлый раз, половина ссор кончается криком в торговый чат,
# в сводке «Пока тебя не было» это идёт вперёд суперчемпионов. Выключено — как прежде.
# HunterStoryGapMinutes — запись о ссоре и о махаче между охотниками на весь мир не чаще; ссора с живым пишется всегда; 0 — без предела.
HunterStories = False
