# ---------------------------------------------------------------------------
# L2Hub: живой мир для одного игрока (docs/WORLD.md). Общий модуль L2Hub для всех хроник Mobius
# (лежит в phantoms/core и ставится вместе с фантомами). Каждое новшество — своим переключателем.
# ---------------------------------------------------------------------------
# Язык текстов L2Hub в игре и в файлах для лаунчера: ru или en. Лаунчер пишет его по языку своего окна, применяется
# после перезапуска сервера. Сейчас его понимают «Мир сейчас» (.world), «Летопись», объявления эльпи и суперчемпиона,
# самопроверка модов (патч 0029, tools/l2hub_lang.py); чего нет в английской таблице — остаётся по-русски.
L2HubLanguage = ru

# Поручения дня (docs/WORLD.md, раздел 1): у каждого персонажа три задания на день по его уровню —
# «Охота» (мобы не слабее своего уровня − 5), «Место дня» (охота на конкретном споте, туда — телепорт из окна),
# «Чемпион» (если включены чемпионы) или «Вместе с охотником» (кач в пати с охотником-фантомом).
# Окно — команда .daily. Задание выполнено — награда сразу: адена и опыт; все три — бонус.
WorldDaily = True

# Час и минута, когда начинается новый день поручений (по часам сервера).
WorldDailyResetTime = 06:30

# Сколько убить: «Охота», «Место дня», «Вместе с охотником»; «Чемпион» — сколько чемпионов.
WorldDailyHuntKills = 100
WorldDailySpotKills = 50
WorldDailyHunterPartyKills = 40
WorldDailyChampions = 1

# Награда за задание: WorldDailyAdena × уровень² адены и WorldDailyExpPercent % опыта до следующего уровня.
# Все три за день — бонус: свиток заточки брони своего грейда (с 20-го уровня; до 20-го — ещё столько же адены).
WorldDailyAdena = 30
WorldDailyExpPercent = 2
WorldDailyBonus = True

# Телепорт из окна поручений на «Место дня»: с 40-го уровня — за столько адены (как у охотников), до 40-го — бесплатно.
WorldDailyTeleportFee = 15000

# Кланы малого мира (docs/PHANTOMS.md, раздел 4.50; решение автора 2026-10-25 — «хочу больше кланов на сервере»): клану на
# 6–11-й уровень хватает меньше членов, чем на официале (30, 50, 80, 120, 140 и 170): на сервере сотня охотников, а не тысячи
# игроков. Перекрывает при старте ClanLevelNRequirement из Feature.ini, только вниз — меньшее значение оттуда остаётся.
# Репутация на уровень (ClanLevelNCost в Feature.ini) — прежняя. False — как в Feature.ini; режим «Хардкор» в настройках
# сервера L2Hub выключает. Применяется после перезапуска сервера. H5, Epilogue и Interlude; у Classic и Essence уровни выше
# 5-го — за клановый опыт, членов там Mobius не считает — ключ ничего не меняет.
SmallWorldClans = True

# Сколько членов нужно клану на 6, 7, 8, 9, 10 и 11-й уровень, через запятую. Уровня нет в хронике (у Interlude клан
# растёт до 8-го, 11-го нет и у Epilogue с H5 без территории) — пропуск.
SmallWorldClanMembers = 10,15,20,30,40,50
