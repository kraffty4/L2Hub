# Банк неповторяющихся имён новых личных помощников.
# Ключей ниже намеренно нет: используются стандартные списки из кода.
# Сохранённые назначения имён этот файл не меняет.
# Элементы списков разделяются точкой с запятой; имена —1–16 латинских букв.
