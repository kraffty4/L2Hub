# Настройки Epilogue. При обновлении существующие значения сервера сохраняются.
# Значения ниже взяты из запасных значений Java, а не из личной установки.

# Автоматически готовить нужные классу боевые заряды.
AutoChargeSkills = True

# Готовить личных напарников к бою и восстанавливать их набор баффов.
PreparePartyBuffs = True

# Как часто проверять баффы напарников, в секундах.
PartyBuffCheckSeconds = 5

# Как часто проверять запасы расходников, в секундах.
PartySupplyCheckSeconds = 60

# Интервал обновления подготовительного набора баффов, в секундах.
PartyBuffRefreshSeconds = 60

# Разрешить пешкам использовать MP-банки.
ManaPotionsEnabled = True

# Запас MP-банок при пополнении.
ManaPotionCount = 10

# Использовать MP-банку при MP ниже этого процента.
ManaPotionPercent = 70

# Запас Spirit Ore для навыков поддержки.
SpiritOreCount = 100

# Запас Holy Water для навыков, которым она нужна.
HolyWaterCount = 10

# На сколько применений атакующих навыков запасать реагенты.
OffensiveReagentCasts = 40

# Перед отдыхом сначала лечить нуждающихся участников группы.
HealBeforeRest = True

# Использовать доступные классу навыки снятия отрицательных эффектов.
CureDebuffs = True
