# Настройки Epilogue. При обновлении существующие значения сервера сохраняются.
# Значения ниже взяты из запасных значений Java, а не из личной установки.

# Частный исторический ник не переносится; диагностика по умолчанию выключена.
# Ники для диагностики через запятую или точку с запятой; пусто — все личные напарники.
Hunters = 

# Включить журнал поведения личных напарников; обычно оставлять выключенным.
Enabled = False

# Пауза между плановыми диагностическими записями, в секундах.
LogEverySeconds = 5

# Минимальная пауза между записями при изменении состояния, в миллисекундах.
MinGapMilliseconds = 1000

# Записывать изменение состояния до очередного планового интервала.
ReportChanges = True
