# Настройки Epilogue. При обновлении существующие значения сервера сохраняются.
# Значения ниже взяты из запасных значений Java, а не из личной установки.

# Цена одной покупки увеличения веса, в адене.
CarryWeightExpansionPrice = 100000000

# Прибавка к грузоподъёмности за покупку, в процентах; покупки складываются.
CarryWeightExpansionBonusPercent = 2000

# Разрешить платное увеличение переносимого веса через Alt+B.
CarryWeightExpansionEnabled = True

# Включить платную смену цвета ника и титула.
Enabled = True

# Цена одной смены цвета ника, в адене.
NameColorPrice = 20000000

# Цена одной смены цвета титула, в адене.
TitleColorPrice = 10000000

# Цена полного расширения инвентаря, в адене.
InventoryExpansionPrice = 50000000

# Разрешить платное расширение инвентаря через Alt+B.
InventoryExpansionEnabled = True
