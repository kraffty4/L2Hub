# ---------------------------------------------------------------------------
# Эпики — уровень для ограничений
# ---------------------------------------------------------------------------
# Эти уровни используются только для рейдового проклятия и штрафа дропа за разницу уровней.
# Реальный уровень NPC, HP, урон, защита, навыки, базовая таблица дропа и базовые XP/SP не меняются.
# Проходки, минимальный уровень входа, состав группы и таймеры сохраняются.
# Настройка через L2Hub: Настройки сервера → Кастом сервера → Рейд-боссы.
# Новые значения применяются после перезапуска игрового сервера.

# Включить прежний допуск по уровням ниже. Новые выключатели штрафов работают независимо.
# Default: False
EpicLevelAccessEnabled = False

# Для каждого босса: 0 — родной уровень; 1..99 — свой уровень для проверки штрафов.
# Например, 85 для АК позволяет персонажу 85 уровня избежать штрафа за разницу уровней.
# Default: 0

# АК — Queen Ant. Родной уровень: 40; 0 — родной.
# Default: 0
EpicQueenAntLevel = 0
# Ядро — Core. Родной уровень: 50; 0 — родной.
# Default: 0
EpicCoreLevel = 0
# Орфен — Orfen. Родной уровень: 50; 0 — родной.
# Default: 0
EpicOrfenLevel = 0
# Закен — день и ночь. Родной уровень: 60; 0 — родной.
# Default: 0
EpicZakenLevel = 0
# Баюм — Baium. Родной уровень: 75; 0 — родной.
# Default: 0
EpicBaiumLevel = 0
# Антарас — все варианты. Родной уровень: 79; 0 — родной.
# Default: 0
EpicAntharasLevel = 0
# Валакас — Valakas. Родной уровень: 85; 0 — родной.
# Default: 0
EpicValakasLevel = 0
# Фринтеза и Scarlet van Halisha. Родной уровень: 85; 0 — родной.
# Default: 0
EpicFrintezzaLevel = 0
# Белеф — Beleth. Родной уровень: 83; 0 — родной.
# Default: 0
EpicBelethLevel = 0
# Байлор — Baylor. Родной уровень: 83; 0 — родной.
# Default: 0
EpicBaylorLevel = 0
# Экимус — Ekimus. Родной уровень: 82; 0 — родной.
# Default: 0
EpicEkimusLevel = 0
# Тиада — Tiat. Родной уровень: 82; 0 — родной.
# Default: 0
EpicTiatLevel = 0
# Гигантский голем хаоса. Родной уровень: 52; 0 — родной.
# Default: 0
EpicChaosGolemLevel = 0
# Полностью снять уровневые наказания с эпиков и их связанной охраны.
# Проклятие, штрафы дропа/спойла и XP/SP. Реальные характеристики и условия входа прежние.
# Не зависит от EpicLevelAccessEnabled. Default: False
EpicNoLevelPenalty = False

# То же для всех рейд-боссов, включая эпиков и их рейдовых миньонов.
# Обычные монстры сохраняют свои правила. Не зависит от EpicLevelAccessEnabled.
# Default: False
RaidNoLevelPenalty = False
