<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L2Hub — макет «Мой мир»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Токены Classic — как в launcher/l2hub/ui/styles.css; новые — только --info и --hunt. */
:root {
  --bg: #100d0a; --win: #16120e; --panel: #1d1813; --panel-2: #251e17; --panel-3: #2d241b;
  --line: #4a3b26; --bronze: #7a6038; --gold: #c9a052; --gold-hi: #e2c27d;
  --text: #ece2cc; --text-2: #b6a68a; --muted: #7f725d;
  --ok: #82c46c; --warn: #e3a63c; --bad: #d4705e; --off: #6f675a; --info: #8fa9cf;
  --serif: "Cinzel", "Times New Roman", serif; --sans: "Inter", "Segoe UI", system-ui, sans-serif; --mono: Consolas, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0907; color: var(--text); font-family: var(--sans); }
body { overflow: auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: #120e0a; }
::-webkit-scrollbar-thumb { background: #3a2e1f; border-radius: 6px; border: 2px solid #120e0a; }

/* Окно лаунчера: минимум 1100×720, как в ТЗ. */
.win { width: 100vw; height: 100vh; min-width: 1100px; min-height: 720px; background: var(--win); border: 1px solid var(--bronze); display: grid; grid-template-rows: 44px 1fr 30px; position: relative; overflow: clip; }
.titlebar { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #130f0b; }
.titlebar .crest { width: 22px; height: 22px; }
.titlebar .crest svg { width: 22px; height: 22px; display: block; }
.titlebar .name { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--gold-hi); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.tag.mock { color: #23190b; background: var(--warn); border-color: var(--warn); font-weight: 600; }
.spacer { flex: 1; }
.body { display: grid; grid-template-columns: 284px 1fr; min-height: 0; position: relative; overflow: clip; }
.statusbar { border-top: 1px solid var(--line); background: #130f0b; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 12.5px; color: var(--muted); }

/* Главный экран хроники — упрощённо, только чтобы показать, где кнопка «Мой мир». */
.sidebar { border-right: 1px solid var(--line); background: #14100c; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.sidebar .cap { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 6px 6px; }
.chron { display: flex; align-items: center; gap: 9px; padding: 6px; border-radius: 7px; border: 1px solid transparent; background: transparent; text-align: left; width: 100%; }
.chron:hover { background: var(--panel); border-color: var(--line); }
.chron.sel { background: var(--panel-2); border-color: var(--gold); }
.chron .n { font-family: var(--serif); font-weight: 600; font-size: 13.5px; }
.chron .m { font-size: 11px; color: var(--muted); display: block; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.sdot.run { box-shadow: 0 0 0 3px rgba(130,196,108,.25); }
.sdot.idle { background: transparent; border: 1px solid var(--gold); }
.main { padding: 16px 22px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.banner { flex: 1; min-height: 200px; border-radius: 8px; border: 1px solid var(--bronze); background: #18130e center 40%/cover; position: relative; }
.banner .era { position: absolute; right: 12px; top: 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-hi); background: rgba(16,13,10,.75); border: 1px solid var(--bronze); padding: 3px 8px; border-radius: 4px; }
.title { font-family: var(--serif); font-weight: 700; font-size: 40px; line-height: 1; color: var(--gold-hi); margin: 0; }
.subline { font-size: 13px; color: var(--muted); margin-top: 8px; }
.actions { display: flex; gap: 10px; }
.btn { height: 50px; border-radius: 8px; border: 1px solid var(--bronze); background: var(--panel); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; padding: 0 12px; flex: 1; white-space: nowrap; }
.btn:hover { border-color: var(--gold); background: var(--panel-2); }
.btn svg { width: 19px; height: 19px; color: var(--gold); flex: none; }
.btn.play { flex: 1.6; background: var(--gold); border-color: var(--gold-hi); color: #23190b; font-family: var(--serif); font-weight: 700; font-size: 21px; }
.btn.play.stop { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.myworld { border-color: var(--gold); background: linear-gradient(180deg, #2a2116, #1d1813); color: var(--gold-hi); }
.btn.myworld .new { font-size: 10px; color: #23190b; background: var(--gold); border-radius: 3px; padding: 0 4px; font-weight: 600; }
.health { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; display: inline-block; }
.dot.on { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.pulse { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.muted { color: var(--muted); } .t2 { color: var(--text-2); }

/* «Мой мир» — полноэкранный вид поверх тела окна, как «Настройки». */
.world { position: absolute; inset: 0; background: var(--win); display: none; grid-template-columns: 196px 1fr; grid-template-rows: auto 1fr; z-index: 3; }
.world.on { display: grid; }
.w-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #1a1510, var(--win)); }
.w-head h2 { font-family: var(--serif); font-size: 22px; color: var(--gold-hi); margin: 0; letter-spacing: .5px; }
.w-head .chr { font-family: var(--serif); color: var(--text-2); font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text-2); white-space: nowrap; }
.pill.warn { border-color: var(--warn); color: var(--warn); }
.pill.bad { border-color: var(--bad); color: var(--bad); }
.xbtn { width: 36px; height: 30px; border: 1px solid transparent; background: transparent; color: var(--text-2); border-radius: 6px; display: grid; place-items: center; }
.xbtn:hover { background: var(--panel-2); color: var(--text); border-color: var(--line); }
.w-nav { border-right: 1px solid var(--line); background: #14100c; padding: 12px 8px; display: flex; flex-direction: column; gap: 3px; }
.w-nav button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 7px; border: 1px solid transparent; background: transparent; text-align: left; font-size: 14px; color: var(--text-2); }
.w-nav button:hover { background: var(--panel); color: var(--text); }
.w-nav button.on { background: var(--panel-2); border-color: var(--gold); color: var(--gold-hi); }
.w-nav button svg { width: 17px; height: 17px; color: var(--gold); flex: none; }
.w-nav .cnt { margin-left: auto; font-size: 11.5px; color: var(--muted); }
.w-nav .unsaved { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.w-nav .future { margin-top: auto; padding: 10px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.5; }
.w-main { min-width: 0; min-height: 0; overflow: auto; padding: 16px 18px 18px; position: relative; }
.w-main.flush { padding: 0; overflow: hidden; display: flex; }

.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.card h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; }
.stat .v { font-family: var(--serif); font-size: 26px; color: var(--gold-hi); line-height: 1.1; }
.stat .s { font-size: 12.5px; color: var(--text-2); margin-top: 4px; }
.stat .s2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
.linkb { background: transparent; border: 0; padding: 0; color: var(--gold); font-size: 12.5px; }
.linkb:hover { color: var(--gold-hi); text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 9px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.seg button.on { background: var(--panel-3); color: var(--gold-hi); }
.sbtn { height: 32px; padding: 0 13px; border-radius: 6px; border: 1px solid var(--bronze); background: var(--panel-2); font-size: 13px; white-space: nowrap; }
.sbtn:hover { border-color: var(--gold); }
.sbtn.primary { background: var(--gold); color: #23190b; border-color: var(--gold-hi); font-weight: 600; }
.sbtn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.sbtn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: 12.5px; color: var(--text-2); background: #1a140e; border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; line-height: 1.5; }
.note.warn { border-color: #6b5222; color: #e8c886; }
.note.bad { border-color: #6b3328; color: #e4a191; }

/* Занятия мира: полоса и легенда */
.occ { display: flex; height: 14px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); background: #120e0a; }
.occ i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
.legend button { background: transparent; border: 0; padding: 0; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-2); }
.legend button:hover { color: var(--gold-hi); }
.legend b { color: var(--text); font-weight: 600; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.ph-HUNT { background: var(--ok); } .ph-TOWN { background: var(--warn); } .ph-STORE { background: var(--gold); }
.ph-PARTY, .ph-RECRUIT { background: var(--info); } .ph-DEAD { background: var(--bad); } .ph-NONE { background: var(--off); }
.kv2 { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 13.5px; }
.kv2 span:nth-child(odd) { color: var(--text-2); }
.kv2 span:nth-child(even) { font-variant-numeric: tabular-nums; text-align: right; }

/* Уровни — гистограмма */
.hist { display: flex; align-items: flex-end; gap: 4px; height: 110px; padding-top: 14px; }
.hist .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.hist .bar i { width: 100%; background: linear-gradient(180deg, var(--gold), #7a5a2c); border-radius: 3px 3px 0 0; display: block; min-height: 2px; }
.hist .bar small { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.hist .bar em { font-style: normal; font-size: 11px; color: var(--text-2); }

/* Лента решений */
.feed { display: flex; flex-direction: column; gap: 9px; }
.feed .it { font-size: 13px; line-height: 1.45; }
.feed .it .who { color: var(--gold-hi); font-weight: 500; }
.feed .it .th { color: var(--text-2); font-style: italic; }
.dec { display: inline-block; font-size: 11px; line-height: 17px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--bronze); color: var(--gold-hi); font-weight: 500; white-space: nowrap; }

/* Население */
.pop { display: grid; grid-template-columns: minmax(0, 1fr) 330px; width: 100%; min-height: 0; }
.pop-l { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.tools { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.search { height: 32px; border-radius: 6px; border: 1px solid var(--line); background: #0f0c09; padding: 0 10px; font-size: 13px; outline: none; width: 190px; }
.search:focus { border-color: var(--gold); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.fchip { font-size: 12px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
.fchip.on { border-color: var(--gold); color: var(--gold-hi); background: var(--panel-2); }
.fchip small { color: var(--muted); }
select { height: 32px; border-radius: 6px; border: 1px solid var(--line); background: #120e0a; padding: 0 6px; font-size: 13px; }
.tbl-wrap { overflow: auto; flex: 1; min-height: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { position: sticky; top: 0; background: #17120d; text-align: left; font-weight: 500; font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); z-index: 1; white-space: nowrap; }
td { padding: 7px 10px; border-bottom: 1px solid #2a2117; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: #1c1610; }
tbody tr.sel { background: #2a2116; box-shadow: inset 2px 0 0 var(--gold); }
td .nm { color: var(--text); font-weight: 500; }
.phase { display: inline-flex; align-items: center; gap: 6px; }
.stale-rows tbody { opacity: .55; }
.pop-r { overflow: auto; padding: 14px 16px; min-height: 0; }
.card-h { display: flex; align-items: baseline; gap: 10px; }
.card-h .big { font-family: var(--serif); font-size: 24px; color: var(--gold-hi); }
.facts { display: grid; grid-template-columns: 112px 1fr; gap: 7px 10px; font-size: 13px; margin-top: 12px; }
.facts span:nth-child(odd) { color: var(--muted); }
.goods { margin-top: 6px; font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
.blank { color: var(--muted); font-size: 13px; padding: 30px 6px; text-align: center; line-height: 1.6; }
.skel { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #1d1813, #2a2218, #1d1813); background-size: 200% 100%; animation: sk 1.2s infinite linear; }
@keyframes sk { to { background-position: -200% 0; } }

/* Напарники */
.comp .role { font-size: 12px; color: var(--gold); text-transform: uppercase; letter-spacing: .08em; }
.comp ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--text-2); line-height: 1.6; }
.cmd { font-family: var(--mono); font-size: 12px; background: #120e0a; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--gold-hi); white-space: nowrap; }

/* Разум и Создатель */
.opt { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #2e2519; font-size: 13.5px; }
.opt:last-child { border-bottom: 0; }
.opt .l { flex: 1; min-width: 0; }
.opt .l small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.field { height: 30px; border-radius: 6px; border: 1px solid var(--line); background: #120e0a; padding: 0 9px; font: 12.5px var(--mono); }
.field:focus { outline: none; border-color: var(--gold); }
.field.chg { border-color: var(--gold); color: var(--gold-hi); }
.switch { width: 38px; height: 21px; border-radius: 21px; border: 1px solid var(--bronze); background: var(--panel-2); position: relative; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 13px; height: 13px; border-radius: 50%; background: var(--muted); transition: left .15s; }
.switch[aria-checked=true] { background: #4a3a1d; border-color: var(--gold); }
.switch[aria-checked=true]::after { left: 20px; background: var(--gold-hi); }
.mind-state { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: #1a140e; margin-bottom: 12px; }
.mind-state .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--bronze); flex: none; }
.mind-state b { font-family: var(--serif); color: var(--gold-hi); font-size: 15px; font-weight: 600; }
.mind-state p { margin: 3px 0 0; font-size: 13px; color: var(--text-2); line-height: 1.5; }
.usage { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 6px 12px; font-size: 13px; }
.usage .h { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
.usage span { font-variant-numeric: tabular-nums; }

.cr { display: grid; grid-template-columns: 210px minmax(0, 1fr); width: 100%; min-height: 0; }
.cr-groups { border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; }
.cr-groups button { width: 100%; display: flex; gap: 8px; align-items: center; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 7px 9px; text-align: left; font-size: 13.5px; color: var(--text-2); }
.cr-groups button.on { background: var(--panel-2); border-color: var(--gold); color: var(--gold-hi); }
.cr-groups .c { margin-left: auto; font-size: 11px; color: var(--muted); }
.cr-groups .chg { margin-left: auto; font-size: 11px; color: var(--warn); }
.cr-r { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.cr-list { overflow: auto; flex: 1; padding: 6px 16px 16px; }
.param { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 14px; align-items: start; padding: 11px 4px; border-bottom: 1px solid #2a2117; }
.param .lb { font-size: 14px; color: var(--text); }
.param .ds { font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.5; }
.param .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; }
.param .meta span { color: var(--muted); }
.param .meta .live { color: var(--ok); }
.param .meta .rst { color: var(--warn); }
.param .meta code { font-family: var(--mono); color: var(--bronze); }
.param.edited .lb::after { content: " • не сохранено"; color: var(--warn); font-size: 11.5px; }
.param .ctl { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
.param .ctl .field { width: 100%; }
.cr-foot { border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; background: #17120d; }
.cr-foot .info { flex: 1; font-size: 12.5px; color: var(--muted); }
.cr-foot .info.dirty { color: var(--warn); }
.banner-rst { margin: 12px 16px 0; }

/* Диалог и тост — стилизованные, без alert/confirm */
.modal-wrap { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 8; background: rgba(8,6,4,.6); }
.modal-wrap.on { display: flex; }
.modal { width: 470px; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 18px 20px; }
.modal.danger { border-color: var(--bad); }
.modal h2 { font-family: var(--serif); font-size: 20px; color: var(--gold-hi); margin: 0 0 8px; }
.modal p { margin: 0 0 10px; color: var(--text-2); font-size: 14px; line-height: 1.5; }
.modal .row { justify-content: flex-end; margin-top: 14px; }
.toast { position: absolute; left: 50%; bottom: 44px; transform: translate(-50%, 20px); background: var(--panel-2); border: 1px solid var(--gold); padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 640px; text-align: center; z-index: 9; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* Пульт макета — только в макете */
.mockp { position: fixed; right: 14px; bottom: 40px; width: 270px; background: #2b2010; border: 1px dashed var(--warn); border-radius: 10px; padding: 10px 12px; z-index: 20; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.mockp h4 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--warn); display: flex; align-items: center; gap: 8px; }
.mockp h4 button { margin-left: auto; background: transparent; border: 1px solid #6b5222; color: var(--warn); border-radius: 5px; font-size: 11px; padding: 1px 7px; }
.mockp .grp { margin-top: 8px; }
.mockp .grp > span { display: block; color: #c9a86a; margin-bottom: 4px; font-size: 11.5px; }
.mockp .opts { display: flex; flex-wrap: wrap; gap: 4px; }

const PH = { HUNT: 'На каче', TOWN: 'В городе', STORE: 'В лавке', RECRUIT: 'Идёт в пати', PARTY: 'В пати', DEAD: 'Убит' };
const DECISION = { HUNT: 'качаться тут', SPOT_UP: 'спот выше', SPOT_DOWN: 'спот ниже', TOWN: 'в город', STORE: 'в лавку', PARTY: 'искать пати' };
const decisionText = (d) => { const a = /^AFK\s+(\d+)$/.exec(d || ''); return a ? `отдых ${a[1]} мин` : DECISION[d] || d; };
const supported = () => chron === 'ct26_highfive';

function huntersApi() {
  if (!supported()) return { ok: false, error: SNAP.huntersGF.error };
  if (mock.api === 'error') throw new Error('Не достучался до окна лаунчера: TimeoutError (макет)');
  const h = JSON.parse(JSON.stringify(SNAP.hunters));
  if (mock.server !== 'on') {
    // Как api.hunters() при выключенном сервере: базы нет — ни уровней, ни занятий.
    h.running = false; h.live = false; h.db = mock.server === 'starting'; h.players = null;
    h.items = h.items.map((x) => ({ name: x.name, level: h.db ? x.level : null, cls: h.db ? x.cls : '' }));
  } else if (mock.pop === 'none') {
    h.items = h.items.map((x) => ({ name: x.name, level: null, cls: '' }));
  }
  if (mock.llm === 'stratoff' && h.strategy) h.strategy.when = 'OFF';
  return h;
}
function brainComp() {
  const b = JSON.parse(JSON.stringify(SNAP.state.components.brain));
  if (mock.server !== 'on') return { state: 'off' };
  if (mock.llm === 'nokey') { b.state = 'nokey'; b.key = false; }
  if (mock.llm === 'down') { b.errors = 3; b.lastError = 'модель недоступна (https://api.deepseek.com): timed out'; }
  return b;
}

// ---------- Обзор ----------
function ovw(main) {
  let h;
  try { h = huntersApi(); } catch (e) { main.innerHTML = apiError(e); return; }
  const live = h.live && mock.stale !== 'stale';
  const items = h.items;
  const phases = { HUNT: 0, TOWN: 0, STORE: 0, PARTY: 0, DEAD: 0 };
  items.forEach((x) => { if (x.phase) phases[x.phase === 'RECRUIT' ? 'PARTY' : x.phase] = (phases[x.phase === 'RECRUIT' ? 'PARTY' : x.phase] || 0) + 1; });
  const inWorld = items.filter((x) => x.phase).length;
  const started = items.filter((x) => x.level != null).length;
  const b = brainComp();
  const st = h.strategy || {};
  const brainTxt = b.state === 'off' ? 'мозги спят' : b.state === 'nokey' ? 'нет ключа API' : b.lastError ? 'не отвечает' : 'на связи';
  const modeSeg = ['OFF', 'ALWAYS', 'WITH_PLAYERS'].map((m) => `<button data-mode="${m}" class="${h.mode === m ? 'on' : ''}">${{ OFF: 'выкл', ALWAYS: 'всегда', WITH_PLAYERS: 'с игроками' }[m]}</button>`).join('');
  let html = mock.server !== 'on' ? serverOffNote(h) + '<div style="height:12px"></div>' : '';
  if (mock.stale === 'stale' && mock.server === 'on') html += '<div class="note warn" style="margin-bottom:12px">Сервер перестал присылать L2HubHunters.json (последний — 47 с назад). Цифры ниже — с того момента, обновятся, когда он ответит.</div>';
  html += `<div class="grid g4">
    <div class="card stat"><h3>Охотники</h3><div class="v">${inWorld || started}<span style="font-size:15px;color:var(--muted)"> / ${items.length}</span></div>
      <div class="s">${live ? 'в мире сейчас' : started ? 'начали путь (из базы)' : 'ещё не начинали'}</div>
      <div class="row" style="margin-top:8px"><span class="seg" id="modeSeg">${modeSeg}</span></div></div>
    <div class="card stat"><h3>Напарники</h3><div class="v">${SNAP.companions.length}</div>
      <div class="s">${SNAP.companions.map((c) => esc(c.name)).join(', ')}</div><div class="s2">${SNAP.companions.some((c) => c.online) ? 'кто-то в мире' : 'сейчас не в мире — зовут в игре'}</div></div>
    <div class="card stat"><h3>Разум <span class="r">${mindDot()}</span></h3><div class="v" style="font-size:18px;line-height:1.3">${esc(SNAP.brain.settings.api.model)}</div>
      <div class="s">${brainTxt}${b.lastReplyAt ? ` · ответ в ${b.lastReplyAt}` : ''}</div>
      <div class="s2">стратег: ${{ OFF: 'выключен', WITH_PLAYERS: 'с игроками', ALWAYS: 'всегда' }[st.when] || '—'} · решений с запуска: ${b.decisions ?? '—'}</div></div>
    <div class="card stat"><h3>Игроки</h3><div class="v">${h.players ?? '—'}</div>
      <div class="s">${h.players ? 'живых в игре — стратег думает' : mock.server === 'on' ? 'живых нет — при «с игроками» мир ждёт' : 'сервер выключен'}</div>
      <div class="s2">режим охотников: ${{ OFF: 'выключены', ALWAYS: 'живут всегда', WITH_PLAYERS: 'только с игроками' }[h.mode]}</div></div>
  </div>`;
  if (live) {
    const total = Object.values(phases).reduce((a, b2) => a + b2, 0) || 1;
    const bar = Object.entries(phases).filter(([, n]) => n).map(([p, n]) => `<i class="ph-${p}" style="width:${(n / total) * 100}%" title="${PH[p]}: ${n}"></i>`).join('');
    const leg = Object.entries(phases).map(([p, n]) => `<button data-f="${p}"><i class="sw ph-${p}"></i>${PH[p]} <b>${n}</b></button>`).join('');
    const earned = items.map((x) => x.earnedPerHour || 0).filter((x) => x > 0);
    const quests = items.filter((x) => x.quest).length;
    const due = items.filter((x) => x.professionDue).length;
    const rich = items.reduce((s, x) => s + (x.adena || 0), 0);
    // Уровни — по пять
    const buckets = {};
    items.forEach((x) => { if (x.level) { const k = Math.floor((x.level - 1) / 5); buckets[k] = (buckets[k] || 0) + 1; } });
    const keys = Object.keys(buckets).map(Number);
    const lo = Math.min(...keys), hi = Math.max(...keys), max = Math.max(...Object.values(buckets));
    let hist = '';

    const recent = items.filter((x) => x.strategy).sort((a, b2) => b2.strategy.at - a.strategy.at).slice(0, 5);
    html += `<div class="grid g2" style="margin-top:12px">
      <div class="card"><h3>Чем занят мир <span class="r"><button class="linkb" data-go-people>все охотники →</button></span></h3>
        <div class="occ">${bar}</div><div class="legend">${leg}</div></div>
      <div class="card"><h3>Экономика</h3><div class="kv2">
        <span>Адены у всех</span><span>${money(rich)}</span>
        <span>Доход с охоты, медиана</span><span>~${money(median(earned))}/ч</span>
        <span>Квестов в работе</span><span>${quests}</span>
        <span>Копят на профу</span><span>${due}</span>
        <span>Лавок в Гиране</span><span>${items.filter((x) => x.store).length}</span></div></div>
    </div>
    <div class="grid g2" style="margin-top:12px">
      <div class="card"><h3>Уровни охотников</h3><div class="hist">${hist}</div></div>
      <div class="card"><h3>Последние решения стратега <span class="r muted">${st.when === 'OFF' ? 'стратег выключен' : ''}</span></h3>
        <div class="feed">${recent.length ? recent.map((x) => `<div class="it"><span class="who">${esc(x.name)}</span> <span class="dec">${esc(decisionText(x.strategy.decision))}</span> <span class="muted">${ago(x.strategy.at)}</span><br><span class="th">«${esc(x.strategy.thought)}»</span></div>`).join('') : '<span class="muted">Пока никто не решал.</span>'}</div></div>
    </div>`;
  } else if (mock.server === 'on' && mock.pop === 'none') {
    html += '<div class="card" style="margin-top:12px"><div class="blank">Охотники ещё не начинали: после «Сбросить всех» они выйдут с 1 уровня в течение 10 секунд.</div></div>';
  }
  main.innerHTML = html;
  main.querySelectorAll('[data-f]').forEach((b2) => (b2.onclick = () => { filter = b2.dataset.f; screen = 'people'; renderWorld(); }));
  main.querySelectorAll('[data-go-people]').forEach((b2) => (b2.onclick = () => { filter = 'ALL'; screen = 'people'; renderWorld(); }));

  bindCommon(main);
}

  rows.sort(sorters[sortBy]);

      <div class="tbl-wrap ${mock.stale === 'stale' ? 'stale-rows' : ''}">${h.items.some((x) => x.level != null) || mock.server === 'off' ? `<table><thead><tr><th>Имя</th><th class="num">Ур.</th><th>Профессия</th><th>Где и чем занят</th><th class="num">Адена</th><th class="num">Доход/ч</th><th>Стратег</th></tr></thead><tbody>${tbody}</tbody></table>${rows.length ? '' : '<div class="blank">Никого не нашлось — сбрось фильтр или поиск.</div>'}`

    </div>

  </div>`;
  $('sort').value = sortBy;
  $('q').oninput = (e) => { query = e.target.value; const pos = e.target.selectionStart; pop(main); const q = $('q'); q.focus(); q.setSelectionRange(pos, pos); };
  $('sort').onchange = (e) => { sortBy = e.target.value; pop(main); };
  main.querySelectorAll('[data-f]').forEach((b) => (b.onclick = () => { filter = b.dataset.f; pop(main); }));
  main.querySelectorAll('tbody tr').forEach((tr) => (tr.onclick = () => { selectedName = tr.dataset.n; pop(main); }));
  $('resetAll').onclick = () => confirmReset(null, h);
  main.querySelectorAll('[data-reset]').forEach((b) => (b.onclick = () => confirmReset(b.dataset.reset, h)));

function hunterCard(x, h) {
  const st = h.strategy || {};
  const q = x.quest ? (x.quest.ready ? `${x.quest.level} ур. — сделан, несёт сдавать` : `${x.quest.level} ур. — до ${hhmm(x.quest.until)}`) : '—';
  let next = '—';
  if (x.nextThink && st.when !== 'OFF') { const m = Math.ceil((x.nextThink - NOW) / 60000); next = m <= 0 ? (x.phase === 'HUNT' ? 'думает…' : 'когда вернётся на спот') : `через ${m} мин`; }
  const facts = [
    ['Уровень', x.level ?? 'ещё не начинал'], ['Профессия', esc(x.cls) || '—'],
    ['Занятие', x.phase ? `<span class="phase"><i class="sw ph-${x.phase}"></i>${PH[x.phase]}</span>` : '<span class="muted">нет данных (сервер выключен)</span>'],
    ['Спот', esc(x.spot) || '—'], ['Ближайший город', esc(x.town) || '—'], ['Пати', esc(x.party) || '—'],
    ['Адена', x.adena != null ? money(x.adena) : '—'], ['Доход с охоты', x.earnedPerHour ? `~${money(x.earnedPerHour)}/ч` : '—'],
    ['Квест', q], ['На профу', x.professionDue ? `не хватает ${money(x.professionDue)}` : 'не копит'],
  ];
  const store = x.store ? `<div class="card" style="margin-top:12px"><h3>Лавка в Гиране <span class="r muted">до ${hhmm(x.store.until)}</span></h3><div class="t2" style="font-size:13px">«${esc(x.store.title)}»</div>
    <div class="goods">${x.store.items.map((i) => `${esc(i.name)}${i.count > 1 ? ` ×${i.count}` : ''} — ${money(i.price)}`).join('<br>')}</div></div>` : '';
  const think = x.strategy ? `<div class="card" style="margin-top:12px"><h3>Стратег <span class="r muted">${ago(x.strategy.at)}</span></h3>
    <span class="dec">${esc(decisionText(x.strategy.decision))}</span><div class="t2" style="font-size:13px;margin-top:6px;font-style:italic;line-height:1.5">«${esc(x.strategy.thought)}»</div>
    <div class="muted" style="font-size:12px;margin-top:6px">следующее решение: ${next}</div></div>` : '';
  return `<div class="card-h"><span class="big">${esc(x.name)}</span><span class="muted">${x.level ? `${x.level} ур.` : ''}</span></div>
    <div class="facts">${facts.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>
    ${store}${think}
    <div class="note" style="margin-top:12px;font-size:12px">Карточка показывает только то, что сервер отдаёт: опыта в %, HP, обид и шмота в L2HubHunters.json нет — они есть у стратега, но наружу не пишутся.</div>
    ${x.level != null ? `<div class="row" style="margin-top:12px"><button class="sbtn danger" data-reset="${esc(x.name)}">Сбросить прогресс</button></div>` : ''}`;
}

  PhantomPartyExpShare: ['companions', 'Напарник берёт долю опыта', 'bool', null, 'Выкл — весь опыт живым.'],
  PhantomPartyLootShare: ['companions', 'Напарник берёт долю лута', 'bool', null, ''],
  PhantomCatchUpRange: ['companions', 'Отстал дальше — телепорт к тебе', 'int', [0, null], 'Игровые единицы.'],
  PhantomAssistRange: ['companions', 'Бьёт твою цель в радиусе', 'int', [0, null], ''],
  PhantomDefendRange: ['companions', 'Защищает пати в радиусе', 'int', [0, null], ''],
  PhantomOwnerLogoutGrace: ['companions', 'Ждёт вышедшего владельца, с', 'int', [0, null], ''],
  PhantomEventCooldown: ['companions', 'Реплика на событие не чаще, с', 'int', [0, null], ''],
  PhantomEventsPerMinute: ['companions', 'Реплик на события в минуту', 'int', [0, null], 'На всех напарников; сверх — заготовки или молчание.'],
  PhantomBrain: ['ai', 'Напарники говорят через мозги', 'bool', null, 'Выкл — только заготовки и приказы.'],
  FakePlayerBrain: ['ai', 'Фейки говорят через мозги', 'bool', null, 'Выкл — заготовки.'],
  FakePlayerBrainTimeout: ['ai', 'Ждать ответа мозгов, с', 'int', [1, null], 'Не дождался — заготовка.'],
};
function settingsIndex() {
  const idx = {};
  for (const f of SNAP.settings) for (const s of f.sections) for (const k of s.keys) idx[k.key] = { ...k, file: f.file };
  return idx;
}
const valueOf = (k, idx) => (k in edits ? edits[k] : k in saved ? saved[k] : idx[k].value);
function creator(main) {
  const idx = settingsIndex();
  const keys = Object.keys(META).filter((k) => idx[k]); // только то, что есть в этой сборке
  const inGroup = (g) => keys.filter((k) => META[k][0] === g);
  const groups = GROUPS.map(([g, t]) => { const n = inGroup(g).length; const ch = inGroup(g).filter((k) => k in edits).length;
    return `<button data-g="${g}" class="${g === crGroup ? 'on' : ''}">${t}${ch ? `<span class="chg">● ${ch}</span>` : `<span class="c">${n}</span>`}</button>`; }).join('');
  const list = inGroup(crGroup).map((k) => {
    const [, label, type, range, hint] = META[k];
    const f = idx[k];
    const live = f.file === 'PhantomHunters.ini';
    const v = valueOf(k, idx);
    const changed = k in edits;
    let ctl;
    if (type === 'bool') ctl = `<button class="switch" role="switch" aria-checked="${String(v).toLowerCase() === 'true'}" data-k="${k}"></button>`;
    else if (type === 'enum') ctl = `<select data-k="${k}" class="${changed ? 'field chg' : ''}">${range.map((o) => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    else ctl = `<input class="field ${changed ? 'chg' : ''}" data-k="${k}" value="${esc(v)}" ${type === 'int' ? 'inputmode="numeric"' : ''}>`;
    const rangeTxt = range && type !== 'enum' ? (range[1] != null ? `${range[0]}–${range[1]}` : `≥ ${range[0]}`) : type === 'list' ? 'список' : type === 'bool' ? 'да / нет' : '';
    return `<div class="param ${changed ? 'edited' : ''}"><div><div class="lb">${esc(label)}</div>${hint || f.description ? `<div class="ds">${esc(hint || f.description)}</div>` : ''}
      <div class="meta"><code>${k}</code><span>${esc(f.file)}</span>${rangeTxt ? `<span>${rangeTxt}</span>` : ''}${live ? '<span class="live">● на ходу, за ~10 с</span>' : '<span class="rst">● после перезапуска гейм-сервера</span>'}</div></div>
      <div class="ctl">${ctl}</div></div>`;
  }).join('');
  const nEdits = Object.keys(edits).length;
  const restartEdits = Object.keys(edits).filter((k) => idx[k] && idx[k].file !== 'PhantomHunters.ini').length;
  main.innerHTML = `<div class="cr"><div class="cr-groups">${groups}
      <div class="note" style="margin-top:12px;font-size:12px">Стратег охотников — в «Разуме». Служебное (сброс, самопроверки, аккаунт фантомов) — в «Настройки» → «Все настройки».</div></div>
    <div class="cr-r">
      ${pendingRestart.length ? `<div class="banner-rst note warn">Сохранено, но ждёт перезапуска гейм-сервера: ${pendingRestart.map((k) => `<span class="cmd">${k}</span>`).join(' ')}. <div class="row" style="margin-top:8px"><button class="sbtn" id="restartNow">Перезапустить гейм-сервер</button><span class="muted">игроки на ~30 с вылетят</span></div></div>` : ''}
      <div class="cr-list">${list}</div>
      <div class="cr-foot"><span class="info ${nEdits ? 'dirty' : ''}">${nEdits ? `Не сохранено: ${nEdits}${restartEdits ? ` · из них после перезапуска: ${restartEdits}` : ''}. Правки не пропадут при переходе между экранами.` : 'Изменений нет.'}</span>
        <button class="sbtn" id="crDiscard" ${nEdits ? '' : 'disabled'}>Отменить правки</button><button class="sbtn primary" id="crSave" ${nEdits ? '' : 'disabled'}>Сохранить</button></div>
    </div></div>`;
  main.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => { crGroup = b.dataset.g; creator(main); }));
  const setEdit = (k, val) => { if (String(val) === String(k in saved ? saved[k] : idx[k].value)) delete edits[k]; else edits[k] = val; };
  main.querySelectorAll('input[data-k]').forEach((i) => (i.onchange = () => { setEdit(i.dataset.k, i.value.trim()); renderWorld(); }));
  main.querySelectorAll('select[data-k]').forEach((s) => (s.onchange = () => { setEdit(s.dataset.k, s.value); renderWorld(); }));
  main.querySelectorAll('.switch[data-k]').forEach((s) => (s.onclick = () => { setEdit(s.dataset.k, s.getAttribute('aria-checked') === 'true' ? 'False' : 'True'); renderWorld(); }));
  $('crDiscard').onclick = () => { for (const k of Object.keys(edits)) delete edits[k]; renderWorld(); };
  $('crSave').onclick = () => {
    const live = [], later = [];
    for (const [k, v] of Object.entries(edits)) { saved[k] = v; (idx[k].file === 'PhantomHunters.ini' ? live : later).push(k); delete edits[k]; }
    pendingRestart = [...new Set([...pendingRestart, ...later])];
    toast(`save_settings(): на ходу — ${live.length}, ждут перезапуска — ${later.length}. Бэкап конфигов — сам (в макете ничего не пишется).`);
    renderWorld();
  };
  const rn = $('restartNow');
  if (rn) rn.onclick = () => {
    modal(`<h2>Перезапустить гейм-сервер?</h2><p>Мир сохранится и поднимется заново примерно за полминуты: игроки и охотники вылетят и вернутся, текущие квесты охотников начнутся заново.</p>
      <div class="row"><button class="sbtn" id="mCancel">Отмена</button><button class="sbtn primary" id="mOk">Перезапустить</button></div>`);
    $('mCancel').onclick = closeModal;
    $('mOk').onclick = () => { closeModal(); pendingRestart = []; toast('restart_game() — в макете ничего не перезапускается'); renderWorld(); };
  };
}

// ---------- Общие кнопки ----------
function bindCommon(root) {
  root.querySelectorAll('[data-act="start"]').forEach((b) => (b.onclick = () => toast("play(id, with_client=false) — в макете ничего не запускается")));
  const r = root.querySelector('#retry');
  if (r) r.onclick = () => { mock.api = 'ok'; renderMock(); renderWorld(); };
}

// ---------- Пульт ----------
const MOCK_GROUPS = [
  ['server', 'Сервер', [['on', 'работает'], ['starting', 'запускается'], ['off', 'выключен']]],
  ['api', 'Ответ API', [['ok', 'есть'], ['loading', 'загрузка'], ['error', 'ошибка']]],
  ['pop', 'Персонажи', [['present', 'есть'], ['none', 'не начинали']]],
  ['llm', 'Разум', [['ok', 'на связи'], ['nokey', 'нет ключа'], ['down', 'недоступна'], ['stratoff', 'стратег выкл']]],
  ['stale', 'Свежесть', [['fresh', 'живые'], ['stale', 'устарели']]],
];
function renderMock() {
  $('mockBody').innerHTML = MOCK_GROUPS.map(([k, t, opts]) => `<div class="grp"><span>${t}</span><div class="opts">${opts.map(([v, l]) => `<button data-mk="${k}" data-mv="${v}" class="${mock[k] === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>`).join('')
    + `<div class="grp"><span>Хроника</span><div class="opts"><button data-ch="ct26_highfive" class="${chron === 'ct26_highfive' ? 'on' : ''}">High Five</button><button data-ch="gracia_final" class="${chron === 'gracia_final' ? 'on' : ''}">Gracia Final</button></div></div>`
    + `<p>Данные — снимок ${SNAP.takenAt} через те же методы Api (hunters, brain_settings, settings_schema, state). «Несохранённые правки» и «ждёт перезапуска» — поменяй что-нибудь в «Создателе».</p>`;
  $('mockBody').querySelectorAll('[data-mk]').forEach((b) => (b.onclick = () => { mock[b.dataset.mk] = b.dataset.mv; renderMock(); renderHome(); renderWorld(); }));
  $('mockBody').querySelectorAll('[data-ch]').forEach((b) => (b.onclick = () => { chron = b.dataset.ch; renderMock(); renderHome(); renderWorld(); }));
}
$('mockMin').onclick = () => { $('mockp').classList.toggle('min'); $('mockMin').textContent = $('mockp').classList.contains('min') ? 'развернуть' : 'свернуть'; };

document.querySelectorAll('.chron').forEach((b) => (b.onclick = () => { chron = b.dataset.chron; renderMock(); renderHome(); renderWorld(); }));
$('openWorld').onclick = () => { worldOpen = true; renderWorld(); };
$('closeWorld').onclick = () => { worldOpen = false; renderWorld(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('modal').classList.contains('on')) closeModal(); else { worldOpen = false; renderWorld(); } } });
document.addEventListener('click', (e) => { const g = e.target.closest && e.target.closest('[data-go]'); if (g) { chron = g.dataset.go; renderMock(); renderHome(); renderWorld(); } });
$('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
$('playBtn').onclick = () => toast('«Играть» работает как сейчас — макет его не трогает');

// Запуск: экран и состояние можно задать в адресе — #people, #creator; ?server=off&llm=down …
const qs = new URLSearchParams(location.search);
for (const k of Object.keys(mock)) if (qs.get(k)) mock[k] = qs.get(k);
if (qs.get('chron')) chron = qs.get('chron');
if (qs.get('sel')) selectedName = qs.get('sel');
if (qs.get('home')) worldOpen = false;
if (qs.get('panel') === '0') $('mockp').style.display = 'none';
if (qs.get('panel') === '1') { $('mockp').classList.remove('min'); $('mockMin').textContent = 'свернуть'; }
if (qs.get('demo') === 'creator') { edits.HunterShotBudget = '25'; edits.PhantomOverhearChance = '40'; pendingRestart = ['PhantomGeneralChat']; crGroup = 'economy'; }
if (location.hash) screen = location.hash.slice(1);
$('ver').textContent = 'v' + SNAP.version;
renderMock(); renderHome(); renderWorld();
</script>
</body>
</html>
